<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>ระบบนับเงินในวงเล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--f:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
--bg-base:#0E1116;--bg-surface:#171B22;--bg-elev:#1F252F;--bg-inset:#0A0D11;
--border:#2A313C;--bs:#3A4350;
--tp:#F2F5F9;--ts:#9BA6B5;--tm:#66717F;
--brand:#17A673;--brand4:#22C58A;--brand6:#0F8259;--brand-bg:#0F2B21;
--in:#22C58A;--out:#FF5C5C;--pending:#F5B23D;--pot:#D4A24C;--admin:#7C6BFF;--info:#3D9CF5;--danger:#E5484D;
--pot-bg:#241C10;--pend-bg:#2A2113;--info-bg:#0E2233;--admin-bg:#1B1733;--out-bg:#2B1618;
--chip:rgba(255,255,255,.07);
--sh-card:0 1px 2px rgba(0,0,0,.4);--sh-float:0 8px 24px rgba(0,0,0,.5);
}
[data-theme="light"]{
--bg-base:#F6F8FA;--bg-surface:#FFFFFF;--bg-elev:#FFFFFF;--bg-inset:#EDF1F5;
--border:#DDE3EA;--bs:#C3CCD7;
--tp:#10151C;--ts:#56616F;--tm:#8A94A2;
--brand:#0F8259;--brand4:#0E8A5F;--brand6:#0B6746;--brand-bg:#E4F5EE;
--in:#0E8A5F;--out:#D93A3A;--pending:#A9700F;--pot:#8F6717;--admin:#5B49E0;--info:#1E6FBF;--danger:#C42F34;
--pot-bg:#FBF3E1;--pend-bg:#FDF4E2;--info-bg:#E7F1FB;--admin-bg:#EEEBFD;--out-bg:#FDECEC;
--chip:rgba(0,0,0,.06);
--sh-card:0 1px 2px rgba(0,0,0,.06);--sh-float:0 8px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg-base);color:var(--tp);font-family:var(--f);font-size:15px;overscroll-behavior:none}
/* จอเดียวเต็มความสูง — หัว/ปุ่ม/เมนู ตรึงอยู่กับที่ เลื่อนเฉพาะเนื้อหาตรงกลาง */
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg-base);position:relative;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px;background:var(--bg-inset);border:1px solid var(--border);color:var(--tp);border-radius:11px;padding:12px 13px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand)}
::-webkit-scrollbar{width:0;height:0}

/* layout */
.hdr{flex:0 0 auto;height:50px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg-surface);z-index:20}
.hdr b{font:700 15px/1 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .code{font:600 11px/1 var(--f);color:var(--ts);background:var(--chip);padding:5px 8px;border-radius:6px;letter-spacing:1px}
/* กระเป๋าเงินบน top bar */
.hwallet{display:flex;flex-direction:column;gap:1px;min-width:0}
.hwallet .l{font:600 9.5px/1 var(--f);color:var(--tm)}
.hwallet .v{font:800 21px/1 var(--f);letter-spacing:-.3px}
.hbtn{width:36px;height:36px;border-radius:11px;background:var(--bg-inset);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;position:relative}
.hbtn .dot2{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;
  background:var(--danger);color:#fff;font:700 9.5px/16px var(--f);text-align:center;padding:0 3px}
/* แถบแท็บ Admin ตรึงใต้ top bar */
.subbar{flex:0 0 auto;padding:7px 12px;background:var(--bg-surface);border-bottom:1px solid var(--border)}
/* ขอบจอกระพริบตอนถึงตา — 2 ชั้น ไม่บังเนื้อหา */
.glow{position:absolute;inset:0;pointer-events:none;z-index:45;
  box-shadow:inset 0 0 0 3px rgba(34,197,138,.95), inset 0 0 26px 7px rgba(34,197,138,.42);
  animation:glowP 1.25s ease-in-out infinite}
@keyframes glowP{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow{animation:none;opacity:.75}}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9px 11px 12px;display:flex;flex-direction:column;gap:8px}
/* สำคัญ: ห้ามให้บล็อกลูกถูกบีบเมื่อเนื้อหายาวเกินจอ ไม่งั้นแถววงกลมผู้เล่นจะแบนหายไป */
.body > *{flex:0 0 auto}
.nav{flex:0 0 auto;height:52px;border-top:1px solid var(--border);background:var(--bg-surface);display:grid;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px/1 var(--f);color:var(--tm);padding:6px 0;position:relative}
.nav button .i{font-size:19px}
.nav button.on{color:var(--brand4)}
.dot{position:absolute;top:2px;right:50%;transform:translateX(20px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font:700 10px/17px var(--f);text-align:center;padding:0 4px}
.foot{flex:0 0 auto;padding:5px 10px;display:flex;gap:8px;background:var(--bg-base);border-top:1px solid var(--border)}

/* cards + text */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:13px;padding:10px 11px}
.lbl{font:600 12px/1.3 var(--f);color:var(--ts)}
.cap{font:400 11px/1.45 var(--f);color:var(--tm)}
.h1{font:700 19px/1.3 var(--f)}
.h2{font:700 14px/1.3 var(--f)}
.money{font:700 28px/1 var(--f)}
.money-l{font:700 26px/1 var(--f)}
.money-s{font:700 16px/1 var(--f)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.sp{margin-left:auto}
.in{color:var(--in)}.out{color:var(--out)}.mut{color:var(--tm)}.pot{color:var(--pot)}.pend{color:var(--pending)}

/* buttons */
.btn{height:52px;border-radius:12px;background:var(--brand);color:#04140D;font:700 15px/1 var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn small{font:500 11px/1 var(--f);color:rgba(4,20,13,.72)}
.btn.big{height:50px;font-size:15px}
.btn.sec{background:var(--bg-inset);border:1px solid var(--bs);color:var(--tp)}
.btn.sec small{color:var(--tm)}
.btn.gold{background:var(--pot);color:#241705}
.btn.gold small{color:rgba(36,23,5,.7)}
.btn.dgr{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ts)}
.btn[disabled]{background:var(--bg-inset);border:1px dashed var(--border);color:var(--tm);cursor:not-allowed}
.btn[disabled] small{color:var(--tm)}
.btn.sm{height:40px;font-size:13px;border-radius:11px;padding:0 13px;width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* banner */
.ban{border-radius:11px;padding:9px 11px;font:600 12px/1.45 var(--f);display:flex;gap:8px;align-items:center}
.ban.y{background:var(--pend-bg);border:1px solid var(--pending);color:var(--pending)}
.ban.i{background:var(--info-bg);border:1px solid var(--info);color:var(--info)}
.ban.a{background:var(--admin-bg);border:1px solid var(--admin);color:var(--admin)}
.ban.g{background:var(--brand-bg);border:1px solid var(--brand);color:var(--brand4)}
.ban.r{background:var(--out-bg);border:1px solid var(--danger);color:var(--out)}
.ban.n{background:var(--bg-inset);border:1px solid var(--border);color:var(--ts)}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(245,178,61,.4)}50%{box-shadow:0 0 0 6px rgba(245,178,61,0)}}
.pulse{animation:pls 2s infinite}
/* ป้ายแจ้งเตือนแบบกะทัดรัด — ไม่กินพื้นที่เต็มความกว้าง */
.notice{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:99px;background:var(--pend-bg);border:1px solid var(--pending);color:var(--pending);
  font:600 12px/1 var(--f);white-space:nowrap}
.notice:active{opacity:.7}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.live{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--in);animation:blip 1.8s infinite}
/* ปุ่มลอยของ Admin — ลากไปวางตรงไหนก็ได้ */
.fab{position:fixed;z-index:45;width:56px;height:56px;border-radius:99px;
  background:var(--admin);color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 3px rgba(124,107,255,.25);
  touch-action:none;user-select:none;cursor:grab}
.fab:active{cursor:grabbing;transform:scale(.94)}
.fab.dragging{opacity:.85;box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 5px rgba(124,107,255,.4)}

/* player rings */
.rings{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 3px;flex:0 0 auto;min-height:78px;align-items:flex-start}
/* ---- โต๊ะโป๊กเกอร์ ---- */
.ptable{position:relative;flex:0 0 auto;height:min(238px,33vh);min-height:196px;margin:0}
.felt{position:absolute;left:11%;top:14%;right:11%;bottom:14%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%, #1d6b47 0%, #14503a 55%, #0e3d2c 100%);
  border:5px solid #3a2a17;
  box-shadow:inset 0 0 34px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.45)}
[data-theme="light"] .felt{background:radial-gradient(ellipse at 50% 42%, #2c8a5e 0%, #1e6b48 55%, #175539 100%);border-color:#8a6a45}
.pcenter{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;max-width:62%;pointer-events:none}
.pcenter .plbl{font:600 10.5px/1 var(--f);color:rgba(255,235,190,.85)}
.pcenter .pamt{font:700 clamp(20px,6vw,27px)/1 var(--f);color:#FFD98A;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.pcenter .psub{font:500 9.5px/1.35 var(--f);color:rgba(255,255,255,.75);max-width:100%}
.pcenter .pnote{font:600 8.5px/1.4 ui-monospace,Menlo,monospace;color:rgba(255,220,150,.8);
  background:rgba(0,0,0,.25);border-radius:7px;padding:2px 7px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mypaid{display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--f);color:var(--ts);
  background:var(--bg-surface);border:1px solid var(--border);border-radius:9px;padding:5px 10px;
  overflow:hidden;white-space:nowrap}
.mypaid b{color:var(--pot);font-size:12px}
.mypaid .d{color:var(--tm);overflow:hidden;text-overflow:ellipsis}
.pseat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:56px}
.pseat .av{width:33px;height:33px;border-radius:99px;background:var(--bg-surface);border:2.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font:700 11.5px/1 var(--f);color:var(--tp);
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pseat .nm{font:500 9.5px/1.1 var(--f);color:var(--ts);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pseat .bg{font:700 9.5px/1 var(--f);padding:3px 6px;border-radius:99px;border:1px solid var(--border);color:var(--tm);
  background:var(--bg-surface);white-space:nowrap}
.pseat .pos{position:absolute;top:-4px;left:1px;z-index:2;width:15px;height:15px;border-radius:99px;
  background:var(--bg-inset);border:1px solid var(--border);font:700 8.5px/13px var(--f);text-align:center;color:var(--tm)}
.pseat.turn .pos{background:var(--pending);color:#241705;border-color:var(--pending)}
.pseat.fold{opacity:.45}
.pseat.fold .av{border-style:dashed;border-color:#66717F;background:var(--bg-inset);color:var(--tm)}
.pseat.me .av{box-shadow:0 0 0 3px rgba(34,197,138,.25),0 2px 8px rgba(0,0,0,.4)}
.pr{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;width:56px}
.pr .av{width:40px;height:40px;border-radius:99px;background:var(--bg-surface);border:2.5px solid var(--border);display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--f);color:var(--tp)}
.pr .nm{font:500 10px/1.1 var(--f);color:var(--ts);text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .bg{font:700 10px/1 var(--f);padding:3px 6px;border-radius:99px;border:1px solid var(--border);color:var(--tm);white-space:nowrap}
.pr.fold{opacity:.45}
.pr.fold .av{border-style:dashed;border-color:#66717F;background:var(--bg-inset);color:var(--tm)}
.pr.me .av{box-shadow:0 0 0 3px rgba(34,197,138,.2)}
.pr{position:relative}
.pr .pos{position:absolute;top:-2px;left:2px;z-index:2;width:16px;height:16px;border-radius:99px;background:var(--bg-inset);border:1px solid var(--border);font:700 9px/14px var(--f);text-align:center;color:var(--tm)}
.pr.turn .pos{background:var(--pending);color:#241705;border-color:var(--pending)}
.posbig{width:22px;height:22px;border-radius:99px;background:var(--bg-inset);border:1px solid var(--border);font:700 11px/20px var(--f);text-align:center;color:var(--ts);flex:none}
.mv{width:26px;height:19px;border-radius:6px;background:var(--bg-inset);border:1px solid var(--border);font-size:9px;color:var(--ts);line-height:1}
.mv[disabled]{opacity:.3}
/* ยอดเงินแยกรายรอบลงเงิน */
.breakdown{display:flex;flex-wrap:wrap;gap:6px}
.breakdown span{display:flex;flex-direction:column;gap:2px;align-items:center;min-width:58px;
  padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.2);border:1px solid transparent}
[data-theme="light"] .breakdown span{background:rgba(0,0,0,.05)}
.breakdown i{font:500 9.5px/1 var(--f);font-style:normal;color:var(--tm)}
.breakdown b{font:700 13px/1 var(--f);color:var(--tp)}
.breakdown .now{border-color:var(--pot)}
.breakdown .now i,.breakdown .now b{color:var(--pot)}
.breakdown .tot{margin-left:auto;background:var(--pot);border-color:var(--pot)}
.breakdown .tot i{color:rgba(36,23,5,.72)}
.breakdown .tot b{color:#241705}
/* เงินแต่ละรอบลงเงิน — กล่องไล่เรียงซ้ายไปขวา รอบปัจจุบันขอบทองสว่าง */
.streets{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.st{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;flex:1;
  padding:5px 7px;border-radius:9px;background:rgba(0,0,0,.22);border:1.5px solid transparent}
[data-theme="light"] .st{background:rgba(0,0,0,.06)}
.st i{font:600 9.5px/1 var(--f);font-style:normal;color:var(--tm)}
.st b{font:700 14px/1.1 var(--f);color:var(--ts)}
.st.done b{color:var(--tp)}
.st.now{border-color:var(--pot);background:rgba(212,162,76,.14)}
.st.now i,.st.now b{color:var(--pot)}
.notation{font:600 10.5px/1.5 ui-monospace,Menlo,monospace;color:var(--pot);background:rgba(0,0,0,.18);border-radius:8px;padding:6px 8px;word-break:break-all}
[data-theme="light"] .notation{background:rgba(0,0,0,.05)}
.legend{display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:5px 9px}
.legend span{display:flex;align-items:center;gap:5px;font:600 10.5px/1 var(--f);color:var(--ts)}
.sw{width:9px;height:9px;border-radius:99px;flex:none}

/* ===== ชิพโป๊กเกอร์ ===== */
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;justify-items:center}
.pchip{position:relative;width:47px;height:47px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 7px rgba(0,0,0,.45), inset 0 -2px 5px rgba(0,0,0,.28), inset 0 2px 4px rgba(255,255,255,.22);
  transition:transform .12s}
.pchip .edge{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.95) 0 5.5%, rgba(0,0,0,.14) 5.5% 12.5%);
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 61%, #000 90%, transparent 91%);
          mask:radial-gradient(circle, transparent 60%, #000 61%, #000 90%, transparent 91%)}
.pchip .disc{position:absolute;inset:20%;border-radius:50%;background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 0 0 0 3px rgba(0,0,0,.12), inset 0 2px 4px rgba(255,255,255,.25)}
.pchip .v{position:relative;z-index:2;font:800 15px/1 var(--f);letter-spacing:-.4px;
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pchip:active{transform:scale(.93)}
.pchip.on{transform:translateY(-5px) scale(1.04);
  box-shadow:0 8px 16px rgba(0,0,0,.5), 0 0 0 3px var(--brand4), inset 0 -2px 5px rgba(0,0,0,.28)}
.pchip.lock{filter:grayscale(1) brightness(.45);box-shadow:none;opacity:.55}
.pchip.lock .lk{position:absolute;z-index:3;font-size:15px}
.pchip.lock .v{opacity:.25}
.pchip.sm{width:30px;height:30px}
.pchip.sm .v{font-size:9px}
.pchip.xs{width:22px;height:22px}
.pchip.xs .v{font-size:7.5px}
/* กองชิพซ้อน */
.stack{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
.stack .col{display:flex;flex-direction:column-reverse;align-items:center}
.stack .col .pchip.xs{margin-top:-15px}
.stack .col .pchip.sm{margin-top:-21px}
.stack .col .pchip:first-child{margin-top:0}
.stack .cnt{font:700 9.5px/1 var(--f);color:var(--ts);margin-top:4px}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--border)}
.av2{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--f);flex:none;background:var(--bg-inset);border:1px solid var(--border)}
.bar{position:relative;height:14px;background:var(--bg-inset);border-radius:4px;flex:1}
.bar .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--bs)}
.bar .f{position:absolute;top:2px;bottom:2px}

/* modal + toast */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--bg-elev);border-radius:20px 20px 0 0;border-top:1px solid var(--bs);padding:8px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.handle{width:38px;height:4px;border-radius:9px;background:var(--bs);margin:5px auto 3px}
.mask.mid{align-items:center;padding:16px}
.mask.mid .sheet{border-radius:20px;border:1px solid var(--bs);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.93);opacity:0}}
#toasts{position:fixed;top:10px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 12px}
.toast{max-width:456px;width:100%;background:var(--bg-elev);border:1px solid var(--bs);border-radius:12px;padding:10px 12px;font:600 12.5px/1.4 var(--f);box-shadow:var(--sh-float);animation:down .2s}
@keyframes down{from{transform:translateY(-14px);opacity:0}}
.toast.g{border-color:var(--brand);color:var(--brand4)}
.toast.r{border-color:var(--danger);color:var(--out)}
.toast.y{border-color:var(--pending);color:var(--pending)}

/* ===== แผงบอกว่าต้องทำอะไรตอนนี้ ===== */
.turnbox{border-radius:11px;padding:6px 11px;display:flex;flex-direction:column;gap:2px;
  border:1px solid var(--border);background:var(--bg-surface)}
.turnbox.mine{border-color:var(--pending);background:var(--pend-bg);animation:pls 2s infinite}
.turnbox.done{border-color:var(--brand);background:var(--brand-bg)}
.turnbox .who{font:700 13.5px/1.25 var(--f)}
.turnbox.mine .who{color:var(--pending)}
.turnbox.done .who{color:var(--brand4)}
.turnbox .sub{font:500 10.5px/1.3 var(--f);color:var(--ts)}
/* ===== แถบความคืบหน้าลงกองกลาง ===== */
.antebox{border:1px solid var(--pot);background:var(--pot-bg);border-radius:13px;padding:10px 12px;
  display:flex;flex-direction:column;gap:7px}
.ticks{display:flex;gap:7px;flex-wrap:wrap}
.tick{width:38px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tick .box{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font:700 13px/1 var(--f);background:var(--bg-inset);border:1.5px dashed var(--bs);color:var(--tm)}
.tick.ok .box{background:var(--brand);border:1.5px solid var(--brand);color:#04140D}
.tick.out .box{opacity:.4}
.tick .nm{font:500 9px/1.1 var(--f);color:var(--ts);max-width:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:8px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand4);border-radius:99px;transition:width .3s}
/* ===== เลือกผู้ชนะ ===== */
.wpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.wcard{border:1.5px solid var(--border);background:var(--bg-surface);border-radius:14px;padding:9px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.wcard.on{border-color:var(--pot);background:var(--pot-bg);box-shadow:0 0 0 2px rgba(212,162,76,.25)}
.wcard.off{opacity:.38}
.wcard .crown{position:absolute;top:-9px;font-size:17px}
.wcard .n{font:600 11.5px/1.1 var(--f);text-align:center}
.wcard .amt{font:700 13px/1 var(--f);color:var(--pot)}
/* ===== ไพ่กลาง (community cards) ===== */
.cards{display:flex;gap:9px;justify-content:center;padding:6px 0}
.pcard{width:54px;height:78px;perspective:500px;flex:none}
.pcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.pcard.flip .in{animation:cardFlip 1s ease-in-out infinite alternate}
@keyframes cardFlip{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@media (prefers-reduced-motion:reduce){.pcard.flip .in{animation-duration:2.4s}}
.pcard .fc,.pcard .bk{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.pcard .bk{background:repeating-linear-gradient(45deg,#7C2B33 0 5px,#5E1E25 5px 10px);border:2.5px solid #fff}
.pcard .fc{background:#FDFDFD;border:1px solid #C9CFD8;transform:rotateY(180deg);flex-direction:column;gap:1px}
.pcard.open .in{transform:rotateY(180deg)}
.pcard .fc .pip{font-size:25px;line-height:1}
.pcard .fc .no{font:800 12px/1 var(--f);color:#10151C}
/* misc */
.kbd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.kbd button{height:50px;border-radius:11px;background:var(--bg-inset);border:1px solid var(--border);font:700 18px/1 var(--f)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;background:var(--chip);font:600 11px/1 var(--f);color:var(--ts)}
.tabs{display:flex;background:var(--bg-inset);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;height:38px;border-radius:9px;font:600 13px/1 var(--f);color:var(--ts)}
.tabs button.on{background:var(--bg-surface);color:var(--tp);box-shadow:var(--sh-card)}
.empty{text-align:center;padding:34px 16px;color:var(--tm);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ic{font-size:32px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{font:600 11px/1 var(--f);color:var(--tm)}
.sel{outline:2px solid var(--brand4);outline-offset:1px}
</style>

<body>

<div id="modals"></div>

<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   ระบบนับเงินในวงเล่น — Single-file app
   สถาปัตยกรรม: Event-sourced. state = reduce(events)
   ชั้นซิงก์ 2 โหมด: local (BroadcastChannel) / cloud (Firebase RTDB)
   ============================================================ */

/* ─────────────────────────────────────────────────────────────
   ตั้งค่า Supabase สำหรับเวอร์ชันที่ deploy (Vercel)
   ใส่ค่า 2 บรรทัดนี้แล้วทุกคนที่เปิดเว็บจะอยู่โหมดข้ามเครื่องทันที
   ถ้าเว้นว่างไว้ แอปจะเริ่มที่โหมด "เครื่องนี้" และให้กรอกค่าเองในหน้าตั้งค่า
   ───────────────────────────────────────────────────────────── */
const SUPABASE_URL      = "https://bpssgrsssvwvvqkwdjnz.supabase.co";
// ⬇⬇⬇ วาง anon public key ระหว่างเครื่องหมายคำพูดบรรทัดล่างนี้ แล้วบันทึก ⬇⬇⬇
const SUPABASE_ANON_KEY = "";
// ⬆⬆⬆ (ขึ้นต้นด้วย eyJhbGci... ยาวประมาณ 200 ตัวอักษร) ⬆⬆⬆
const SB_TABLE = 'pk_events';
const SB_CDN   = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';

/* สีชิพตามมูลค่า — จัดให้ชุดพื้นฐาน 20/40/60/80/100 ต่างสีกันชัดทั้ง 5 ใบ */
/* สีชิพแบบคาสิโน — จับคู่มูลค่าตรงตัวก่อน (ไม่ซ้ำกันในชุดเดียวกันแน่นอน) แล้วค่อย fallback ตามช่วง */
const CHIP_EXACT = {
  1:  ['#FDFDFD','#C9D1DB','#10151C'],   // ขาว
  5:  ['#F0575C','#B01E24','#fff'],      // แดง
  10: ['#57ABFF','#1B62B8','#fff'],      // ฟ้า
  20: ['#2BC98A','#0C7A50','#04140D'],   // เขียว
  25: ['#4ECDC4','#1E8E86','#04211F'],   // เขียวน้ำทะเล
  30: ['#FFD24D','#D9A211','#241705'],   // เหลือง
  40: ['#FF9A4D','#D96A10','#2A1403'],   // ส้ม
  50: ['#5B78F0','#2C41A8','#fff'],      // น้ำเงิน
  60: ['#A88CFF','#6A4BE0','#fff'],      // ม่วง
  70: ['#8AD44A','#4E8A1C','#122A02'],   // เขียวมะนาว
  80: ['#FF6FA5','#C42566','#fff'],      // ชมพู
  90: ['#7ADBF0','#2E93AC','#062A33'],   // ฟ้าน้ำแข็ง
  100:['#4A5462','#12161D','#fff'],      // ดำ
  500:['#E9E2FF','#9B7BD0','#2A1050'],   // เงินม่วง
  1000:['#FFD264','#C8901A','#241705'],  // ทอง
};
const CHIP_FACE = v => {
  const e = CHIP_EXACT[v] ||
    (v<=1?CHIP_EXACT[1]:v<=5?CHIP_EXACT[5]:v<=10?CHIP_EXACT[10]:v<=20?CHIP_EXACT[20]:
     v<=25?CHIP_EXACT[25]:v<=30?CHIP_EXACT[30]:v<=40?CHIP_EXACT[40]:v<=50?CHIP_EXACT[50]:
     v<=60?CHIP_EXACT[60]:v<=70?CHIP_EXACT[70]:v<=80?CHIP_EXACT[80]:v<=90?CHIP_EXACT[90]:
     v<=100?CHIP_EXACT[100]:v<=500?CHIP_EXACT[500]:CHIP_EXACT[1000]);
  return {bg:`linear-gradient(145deg,${e[0]},${e[1]})`, ink:e[2], hi:e[0]};
};

const TIER_COLORS = ['#22C58A','#D4A24C','#3D9CF5','#C77DFF','#FF9F45','#FF6FA5'];
const TIER_INK    = ['#04140D','#241705','#04121F','#1B0A26','#2A1403','#2B0A18'];
const AVCOLORS = ['#22C58A','#3D9CF5','#F5B23D','#FF6FA5','#C77DFF','#FF9F45','#4ECDC4','#FF8A65'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B = n => Math.round(n*100);                       // บาท -> สตางค์
const fmt = s => (s/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS = s => (s/100).toLocaleString('th-TH',{maximumFractionDigits:2});
/** ยอดเงินของตัวเอง — เป็น ••••• เมื่อกดซ่อน (กันคนข้างๆ เห็น) */
let hideBal = false;
const fmtBal  = s => hideBal ? '•••••' : fmt(s);
const fmtBalS = s => hideBal ? '•••'   : fmtS(s);
/** สำหรับใส่เป็นค่าตั้งต้นในช่องกรอก — ห้ามมีคอมมา ไม่งั้นอ่านกลับมาผิด */
const fmtIn = s => String((s||0)/100);
/** อ่านจำนวนเงินจากช่องกรอก ทนคอมมา ช่องว่าง และสัญลักษณ์บาท */
const parseAmt = v => {
  const n = parseFloat(String(v==null?'':v).replace(/[,\s฿]/g,''));
  return isFinite(n) ? n : 0;
};
const initials = n => (n||'?').trim().slice(0,2);
const roomCode = () => String(Math.floor(1000 + Math.random()*9000));   // ตัวเลข 4 หลัก (1000–9999)
const nowT = () => Date.now();

/* ---------- ชิพโป๊กเกอร์ ---------- */
/** วาดชิพ 1 อัน · v = มูลค่าเป็นบาท */
function pokerChip(v, cls, extra){
  const f = CHIP_FACE(v);
  return `<span class="pchip ${cls||''}" style="background:${f.bg};color:${f.ink}" ${extra||''}>
    <i class="edge"></i><i class="disc"></i><b class="v">${v>=1000?(v/1000)+'K':v}</b>
    ${(cls||'').includes('lock')?'<i class="lk">🔒</i>':''}</span>`;
}
/** แตกยอดเงินเป็นกองชิพซ้อน เพื่อให้เห็นภาพเหมือนโต๊ะจริง */
function chipStack(satang, size){
  const DEN=[1000,500,100,80,60,40,20,10,5,1];
  let left = Math.round(satang/100), out=[];
  for(const d of DEN){ const n=Math.floor(left/d); if(n>0){ out.push([d,n]); left-=n*d; } }
  if(!out.length) return '<span class="cap">ยังไม่มีเงินในกอง</span>';
  return `<div class="stack">${out.slice(0,6).map(([d,n])=>`<div class="col">
    ${Array.from({length:Math.min(n,5)},()=>pokerChip(d,size||'xs')).join('')}
    <span class="cnt">${n>5?'×'+n:'×'+n}</span></div>`).join('')}</div>`;
}

/* ---------- เสียงและการสั่น ---------- */
const Sfx = {
  ctx:null, on:true,
  init(){ this.on = LS.get('pk:sound') !== '0'; },
  /** ดังได้เฉพาะตอนหน้าเว็บเปิดอยู่จริงเท่านั้น — แท็บที่ซ่อน/ย่อไว้ต้องเงียบสนิท */
  killed:false,          // ปิดถาวรเมื่อหน้าเว็บกำลังถูกปิด/แช่แข็ง
  canPlay(){
    if(!this.on || this.killed) return false;
    try{
      // 1) แท็บถูกซ่อน / สลับแอปบนมือถือ
      if(document.visibilityState !== 'visible' || document.hidden) return false;
      // 2) หน้าต่างอยู่ข้างหลังหน้าต่างอื่น — ยังนับเป็น visible แต่ผู้ใช้ไม่ได้ดูอยู่
      if(typeof document.hasFocus === 'function' && !document.hasFocus()) return false;
    }catch(e){}
    return true;
  },
  /** ปิดเสียงถาวรสำหรับหน้านี้ (ใช้ตอนกำลังปิดหน้า) */
  kill(){
    this.killed = true;
    try{ if(this.ctx){ this.ctx.close(); this.ctx=null; } }catch(e){}
  },
  /** หยุดเสียงที่กำลังจะดังทั้งหมด + พักเครื่องเสียง */
  silence(){
    try{ if(this.ctx && this.ctx.state==='running') this.ctx.suspend(); }catch(e){}
  },
  unlock(){ if(this.killed || !this.canPlay()) return; if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return; }
    try{ const C = window.AudioContext||window.webkitAudioContext; if(C) this.ctx = new C(); }catch(e){}
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
  },
  tone(freq, start, dur, vol, type){
    if(!this.ctx || this.killed) return;
    const t0 = this.ctx.currentTime + start;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol==null?0.25:vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  },
  buzz(ms){ if(!this.canPlay()) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} },
  /** ถึงตาคุณ — เสียงเด่น ต้องได้ยินชัดในวงที่เสียงดัง */
  myTurn(){ if(!this.canPlay()) return; this.unlock();
    this.tone(880,0,.16,.3); this.tone(1320,.17,.20,.3); this.tone(1760,.36,.26,.26);
    this.buzz([90,70,90,70,160]); },
  /** เตือนให้ลงกองกลาง */
  ante(){ if(!this.canPlay()) return; this.unlock();
    this.tone(660,0,.18,.24); this.tone(880,.19,.22,.22); this.buzz([70,60,120]); },
  /** ชนะ */
  win(){ if(!this.canPlay()) return; this.unlock();
    [523,659,784,1047].forEach((f,i)=>this.tone(f,i*0.11,.3,.26,'triangle')); this.buzz([50,40,50,40,220]); },
  /** เสียงชิพตอนลงเงิน */
  chip(){ if(!this.canPlay()) return; this.unlock();
    this.tone(2100,0,.05,.14,'square'); this.tone(1500,.045,.07,.10,'square'); },
  toggle(){ this.on=!this.on; LS.set('pk:sound', this.on?'1':'0');
    if(this.on){ this.unlock(); this.tone(880,0,.12,.25); } return this.on; }
};

/* ---------- storage ที่ทนทาน (private mode / data: URL / iframe ใช้ได้) ---------- */
const LS = (()=>{
  let ok = true;
  try{ window.localStorage.setItem('pk:_t','1'); window.localStorage.removeItem('pk:_t'); }
  catch(e){ ok = false; }
  const mem = {};
  return {
    ok,
    get(k){ try{ return ok ? window.localStorage.getItem(k) : (mem[k]??null); }catch(e){ return mem[k]??null; } },
    set(k,v){ try{ if(ok) window.localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    del(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }catch(e){ delete mem[k]; } }
  };
})();
function safeChannel(name){
  try{ return new BroadcastChannel(name); }catch(e){ return {postMessage(){}, close(){}, set onmessage(v){}}; }
}

/* ---------- identity ---------- */
const Me = {
  load(){ try{ return JSON.parse(LS.get('pk:me')||'null'); }catch(e){ return null; } },
  save(o){ LS.set('pk:me', JSON.stringify(o)); }
};
let me = Me.load() || { id: uid(), name: '' };
Me.save(me);

/* ============================================================
   ENGINE — reduce(events) -> state
   ทุก event ที่ผ่าน validate แล้วเท่านั้นถึงจะเปลี่ยน state
   ============================================================ */
function blankState(){
  return {
    room:null, members:{}, wallets:{}, bank:{issued:0,returned:0},
    rounds:[], curRound:null, lastWinnerId:null, requests:{}, debts:{}, txs:[], feed:[],
    seq:0, broken:null
  };
}
const netIssued = st => st.bank.issued - st.bank.returned;
const sumWallets = st => Object.values(st.wallets).reduce((a,w)=>a+w.balance,0);
const potNow = st => st.curRound ? st.curRound.pot : 0;

function ensureWallet(st,mid){
  if(!st.wallets[mid]) st.wallets[mid] = {balance:0,issuedIn:0,returnedOut:0,totalBet:0,totalWon:0};
  return st.wallets[mid];
}
function pushTx(st,ev,type,from,to,amount,note){
  st.seq++;
  st.txs.push({seq:st.seq,id:ev.id,type,from,to,amount,note:note||'',by:ev.by,at:ev.at,roundId:ev.roundId||null});
}
function feed(st,ev,icon,text,kind){
  st.feed.push({id:ev.id,at:ev.at,icon,text,kind:kind||'n'});
  if(st.feed.length>400) st.feed.shift();
}
function nameOf(st,id){ return st.members[id]?.name || '—'; }
function seatOf(r,mid){ return r.seats.find(s=>s.memberId===mid); }
function activeSeats(r){ return r.seats.filter(s=>s.state!=='SITTING_OUT'); }
function notFolded(r){ return activeSeats(r).filter(s=>s.state!=='FOLDED'); }

/* ---- กติกาโป๊กเกอร์: ใครต้องตัดสินใจต่อ / รอบครบหรือยัง ---- */
function needsAct(r,s){ return s.state==='IN' && (!s.acted || s.contributed < r.currentBet); }
function roundComplete(r){
  const ins = r.seats.filter(s=>s.state==='IN');
  if(ins.length<=1) return true;                 // เหลือคนเดียว = จบทันที
  return ins.every(s=>!needsAct(r,s));
}
/** หาคนถัดไปที่ต้องลง เริ่มนับจากตำแหน่งถัดจาก fromPos */
function nextTurn(r, fromPos){
  const order = r.seats.slice().sort((a,b)=>a.pos-b.pos);
  const n = order.length;
  if(!n) return null;
  let start = order.findIndex(s=>s.pos===fromPos);
  if(start<0) start = -1;
  for(let i=1;i<=n;i++){
    const s = order[(start+i+n)%n];
    if(needsAct(r,s)) return s.memberId;
  }
  return null;
}
/** เรียกหลังทุก action: เลื่อนตา + ปิดรอบอัตโนมัติถ้าเปิดไว้ */
/** ปิดรอบลงเงินปัจจุบัน แล้วเปิดรอบลงเงินใหม่ (โหมดโป๊กเกอร์หลายรอบ) */
function nextStreet(st, r, ev){
  const total = r.seats.reduce((a,s)=>a+(s.contributed||0),0);
  r.streets.push({
    index: r.street,
    total,
    note: actionNotation(r),
    detail: r.seats.filter(s=>s.contributed>0).map(s=>({memberId:s.memberId, amount:s.contributed}))
  });
  // ย้ายยอดของรอบที่ปิดไปเก็บสะสมไว้ แล้วเริ่มนับใหม่จาก 0
  r.seats.forEach(s=>{ s.paid=(s.paid||0)+(s.contributed||0);
    s.contributed=0; s.acted=false; s.tier=null; s.lastKind=null; });
  r.currentBet=0; r.tiers=[]; r.log=[]; r.street++; r.complete=false;
  // รอบลงเงินใหม่เริ่มที่ผู้เริ่มคนเดิม ถ้าหมอบไปแล้วเลื่อนไปคนถัดไปที่ยังเล่นอยู่
  const ord = r.seats.slice().sort((a,b)=>a.pos-b.pos);
  let start = ord.find(s=>s.memberId===r.starterId && s.state==='IN') || ord.find(s=>s.state==='IN');
  r.turn = start ? start.memberId : null;
  feed(st,ev,'🔄','จบรอบลงเงินที่ '+(r.street-1)+' (฿'+fmtS(total)+') — เปิดรอบลงเงินที่ '+r.street+
    ' · กองสะสม ฿'+fmtS(r.pot)+(start?' · เริ่มที่ '+nameOf(st,start.memberId):''),'g');
}

function afterAction(st, r, ev, actedPos){
  if(roundComplete(r)){
    const alive = notFolded(r).length;
    // โหมดโป๊กเกอร์: ครบตาแล้วยังเหลือคนสู้กัน ≥2 คน → เปิดรอบลงเงินใหม่ต่อ
    if(st.room.settings.multiStreet && alive > 1 && r.status==='OPEN'){
      nextStreet(st, r, ev);
      return;
    }
    r.turn = null; r.complete = true;
    if(st.room.settings.autoClose && r.status==='OPEN'){
      r.status='LOCKED';
      feed(st,ev,'🔒',(alive<=1?'เหลือคนเดียว':'ครบตาแล้ว')+' — ปิดรับลงเงินอัตโนมัติ (กองรวม ฿'+fmtS(r.pot)+')','y');
    }
  } else {
    r.turn = nextTurn(r, actedPos);
    r.complete = false;
  }
}
/** ยอดที่ผู้เล่นคนนี้จ่ายไปทั้งหมดในมือนี้ (กองกลาง + ทุกรอบลงเงิน) */
function paidTotal(s){ return (s.ante||0) + (s.paid||0) + (s.contributed||0); }
/** ยอดรวมของรอบลงเงินที่ปิดไปแล้วทั้งหมด */
function streetsTotal(r){ return (r.streets||[]).reduce((a,x)=>a+x.total,0); }
/** ลงกองกลางครบทุกคนหรือยัง — ครบแล้วเริ่มเดิมพันที่ starterId */
function anteComplete(r){
  const ins = r.seats.filter(s=>s.state==='IN');
  return ins.length>0 && ins.every(s=>s.ante>0);
}
function maybeStartBetting(st, r, ev){
  if(r.phase!=='ANTE' || !anteComplete(r)) return;
  r.phase='BETTING';
  // ถ้าผู้เริ่มพักรอบนี้ไป ให้เลื่อนไปคนถัดไปที่ยังเล่นอยู่
  let start = r.seats.find(s=>s.memberId===r.starterId && s.state==='IN');
  if(!start){
    const ord = r.seats.slice().sort((a,b)=>a.pos-b.pos).filter(s=>s.state==='IN');
    start = ord[0]||null;
    if(start) r.starterId = start.memberId;
  }
  r.turn = start?start.memberId:null;
  feed(st,ev,'🎯','ลงกองกลางครบแล้ว (฿'+fmtS(r.pot)+') — เริ่มเดิมพันที่ '+(start?nameOf(st,start.memberId):'—'),'g');
}
/** สัญลักษณ์ลำดับการลง เช่น 1/0 › 2/20 › 3/หมอบ */
function actionNotation(r){
  return (r.log||[]).map(a=>a.pos+'/'+(a.kind==='FOLD'?'หมอบ':fmtS(a.level))).join(' › ');
}

/* --- ตัวตรวจ: คืน null ถ้าผ่าน, คืนข้อความถ้าไม่ผ่าน --- */
function validate(st, ev){
  const R = st.room, me_ = st.members[ev.by];
  if(ev.t!=='ROOM_CREATED'){
    if(!R) return 'ยังไม่มีห้อง';
    if(R.status==='CLOSED' && ev.t!=='ROOM_CLOSED') return 'ห้องปิดแล้ว';
  }
  const isAdmin = m => m && (m.role==='ADMIN'||m.role==='CO_ADMIN');
  switch(ev.t){
    case 'ROOM_CREATED': return st.room ? 'มีห้องอยู่แล้ว' : null;
    case 'MEMBER_JOINED': return st.members[ev.mid] ? 'อยู่ในห้องแล้ว' : null;
    case 'JOIN_REQUESTED': {
      const m = st.members[ev.by]; if(!m) return 'ไม่พบผู้ใช้';
      if(m.status!=='WATCHING') return 'ขอไปแล้ว';
      return null;
    }
    case 'JOIN_APPROVED': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      const m = st.members[ev.mid]; if(!m) return 'ไม่พบผู้เล่น';
      if(m.status==='PLAYING') return 'เล่นอยู่แล้ว';
      const used = Object.values(st.members).filter(x=>x.status==='PLAYING'||x.status==='SITTING_OUT').length;
      if(used >= st.room.maxSeats) return 'ที่นั่งเต็ม เพิ่มที่นั่งก่อน';
      return null;
    }
    case 'JOIN_REJECTED': return isAdmin(me_)?null:'เฉพาะ Admin';
    case 'ISSUE': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      if(ev.amount<=0) return 'จำนวนเงินไม่ถูกต้อง';
      return null;
    }
    case 'RETURN_TO_BANK': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      const w = st.wallets[ev.mid];
      if(!w || w.balance < ev.amount) return 'เงินในกระเป๋าไม่พอ';
      return null;
    }
    case 'TOPUP_REQUESTED': {
      const m = st.members[ev.by];
      if(!m || m.status!=='PLAYING') return 'ต้องเป็นผู้เล่นก่อน';
      if(ev.amount<=0) return 'จำนวนเงินไม่ถูกต้อง';
      return null;
    }
    case 'REQ_APPROVED': case 'REQ_REJECTED': {
      const rq = st.requests[ev.rid];
      if(!rq) return 'ไม่พบคำขอ';
      if(rq.status!=='PENDING') return 'คำขอนี้ถูกดำเนินการไปแล้ว';
      if(rq.approver==='ADMIN' && !isAdmin(me_)) return 'เฉพาะ Admin';
      if(rq.approver!=='ADMIN' && rq.approver!==ev.by) return 'ไม่ใช่ผู้มีสิทธิ์อนุมัติ';
      if(ev.t==='REQ_APPROVED' && rq.type==='BORROW'){
        const w = st.wallets[rq.from];
        if(!w || w.balance < rq.amount) return 'เงินของผู้ให้ยืมไม่พอแล้ว';
      }
      return null;
    }
    case 'TRANSFER': {
      const w = st.wallets[ev.from];
      if(ev.from===ev.to) return 'โอนให้ตัวเองไม่ได้';
      if(ev.amount<=0) return 'จำนวนเงินไม่ถูกต้อง';
      if(!w || w.balance < ev.amount) return 'เงินไม่พอ';
      if(ev.by!==ev.from) return 'ต้องเป็นเจ้าของกระเป๋า';
      return null;
    }
    case 'BORROW_REQUESTED': {
      if(ev.from===ev.to) return 'ยืมจากตัวเองไม่ได้';
      if(ev.amount<=0) return 'จำนวนเงินไม่ถูกต้อง';
      return null;
    }
    case 'ROUND_OPENED': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      if(st.curRound && st.curRound.status!=='SETTLED' && st.curRound.status!=='VOIDED') return 'ยังมีรอบที่เปิดอยู่';
      return null;
    }
    /* ev.amount = "ยอดรวมของรอบ (level)" ไม่ใช่ยอดที่จ่ายเพิ่ม */
    case 'BET': {
      const r = st.curRound;
      if(!r || r.status!=='OPEN') return 'รอบนี้ปิดรับลงเงินแล้ว';
      if(r.phase==='ANTE') return 'ต้องลงเงินกองกลางให้ครบทุกคนก่อน';
      const m = st.members[ev.by];
      if(!m || m.status!=='PLAYING') return 'คุณยังไม่ได้รับอนุมัติให้เล่น';
      const s = seatOf(r,ev.by);
      if(!s) return 'คุณไม่ได้อยู่ในรอบนี้';
      if(s.state==='FOLDED') return 'คุณหมอบรอบนี้แล้ว';
      if(s.state==='SITTING_OUT') return 'คุณพักรอบนี้';
      if(!needsAct(r,s)) return 'คุณตามครบแล้ว รอคนอื่น';
      if(st.room.settings.strict && r.turn && r.turn!==ev.by) return 'ยังไม่ถึงตาคุณ — ตาของ '+nameOf(st,r.turn);
      if(ev.amount < r.currentBet) return 'ต้องลงอย่างน้อย ฿'+fmtS(r.currentBet);
      const cost = ev.amount - s.contributed;
      if(cost<=0) return 'ยอดนี้ไม่ได้เพิ่มจากที่คุณลงไว้ — กด "ผ่าน" แทน';
      const w = st.wallets[ev.by];
      if(!w || w.balance < cost) return 'เงินไม่พอ (ต้องจ่ายเพิ่ม ฿'+fmtS(cost)+')';
      return null;
    }
    case 'FOLD': {
      const r = st.curRound;
      if(!r || r.status!=='OPEN') return 'รอบนี้ปิดแล้ว';
      if(r.phase==='ANTE') return 'ยังอยู่ในช่วงลงกองกลาง';
      const s = seatOf(r,ev.by);
      if(!s || s.state!=='IN') return 'คุณไม่ได้อยู่ในรอบนี้';
      if(st.room.settings.strict && r.turn && r.turn!==ev.by) return 'ยังไม่ถึงตาคุณ';
      if(notFolded(r).length<=1) return 'คุณเป็นคนสุดท้ายที่เหลือ หมอบไม่ได้';
      return null;
    }
    case 'CHECK': {
      const r = st.curRound;
      if(!r || r.status!=='OPEN') return 'รอบนี้ปิดแล้ว';
      if(r.phase==='ANTE') return 'ยังอยู่ในช่วงลงกองกลาง';
      const s = seatOf(r,ev.by);
      if(!s || s.state!=='IN') return 'คุณไม่ได้อยู่ในรอบนี้';
      if(s.contributed < r.currentBet)
        return 'ต้องตามให้ครบ ฿'+fmtS(r.currentBet)+' (จ่ายเพิ่ม ฿'+fmtS(r.currentBet-s.contributed)+') หรือหมอบ';
      if(st.room.settings.strict && r.turn && r.turn!==ev.by) return 'ยังไม่ถึงตาคุณ';
      if(s.acted && s.contributed===r.currentBet) return 'คุณตัดสินใจไปแล้ว';
      return null;
    }
    case 'SEATS_REORDER': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      return null;
    }
    /* ---- ลงเงินกองกลาง (ante) ก่อนเริ่มเดิมพัน ---- */
    case 'ANTE': {
      const r = st.curRound;
      if(!r || r.status!=='OPEN') return 'รอบนี้ปิดแล้ว';
      if(r.phase!=='ANTE') return 'พ้นช่วงลงเงินกองกลางแล้ว';
      const m = st.members[ev.by];
      if(!m || m.status!=='PLAYING') return 'คุณยังไม่ได้รับอนุมัติให้เล่น';
      const s = seatOf(r,ev.by);
      if(!s || s.state!=='IN') return 'คุณไม่ได้อยู่ในรอบนี้';
      if(s.ante>0) return 'คุณลงกองกลางไปแล้ว';
      const w = st.wallets[ev.by];
      if(!w || w.balance < r.anteAmount) return 'เงินไม่พอลงกองกลาง (ต้องมี ฿'+fmtS(r.anteAmount)+')';
      return null;
    }
    case 'ANTE_SITOUT': {
      const r = st.curRound;
      if(!r || r.phase!=='ANTE') return 'ไม่อยู่ในช่วงลงกองกลาง';
      const s = seatOf(r,ev.by);
      if(!s || s.state!=='IN') return 'คุณไม่ได้อยู่ในรอบนี้';
      if(s.ante>0) return 'คุณลงกองกลางไปแล้ว';
      return null;
    }
    case 'ADMIN_TRANSFERRED': {
      if(!me_ || me_.role!=='ADMIN') return 'เฉพาะ Admin เจ้าของห้องเท่านั้น';
      if(ev.mid===ev.by) return 'คุณเป็น Admin อยู่แล้ว';
      const t = st.members[ev.mid];
      if(!t) return 'ไม่พบผู้เล่นคนนี้';
      if(t.status!=='PLAYING') return 'ต้องเป็นผู้เล่นที่อยู่ในวงเท่านั้น';
      return null;
    }
    case 'ROUND_LOCK': case 'ROUND_UNLOCK': case 'ROUND_VOID': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      if(!st.curRound) return 'ไม่มีรอบ';
      return null;
    }
    case 'PAYOUT': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      const r = st.curRound;
      if(!r) return 'ไม่มีรอบ';
      const tot = ev.winners.reduce((a,w)=>a+w.amount,0);
      if(tot !== r.pot) return 'ยอดจ่ายต้องเท่ากองกลางพอดี';
      for(const w of ev.winners){
        const s = seatOf(r,w.memberId);
        if(s && s.state==='FOLDED') return 'ผู้เล่นนี้หมอบรอบนี้แล้ว';
        if(w.amount<0) return 'จำนวนเงินไม่ถูกต้อง';
      }
      // ถ้าระบุคนเริ่มรอบถัดไปมา ต้องเป็นหนึ่งในผู้ชนะเท่านั้น
      if(ev.startNextId && !ev.winners.some(w=>w.memberId===ev.startNextId && w.amount>0))
        return 'ผู้เริ่มรอบถัดไปต้องเป็นผู้ชนะที่ได้รับเงิน';
      return null;
    }
    case 'SEATS_SET': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      const used = Object.values(st.members).filter(x=>x.status==='PLAYING'||x.status==='SITTING_OUT').length;
      if(ev.n < used) return 'ลดที่นั่งต่ำกว่าคนที่เล่นอยู่ไม่ได้';
      if(ev.n<1||ev.n>20) return 'ที่นั่งต้องอยู่ระหว่าง 1–20';
      return null;
    }
    case 'MEMBER_REMOVED': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      const w = st.wallets[ev.mid];
      if(w && w.balance>0) return 'ผู้เล่นยังมีเงิน ฿'+fmtS(w.balance)+' ต้องเคลียร์ก่อน';
      return null;
    }
    case 'SETTINGS_SET': return isAdmin(me_)?null:'เฉพาะ Admin';
    case 'ROOM_CLOSED': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      if(st.curRound && !['SETTLED','VOIDED'].includes(st.curRound.status)) return 'ต้องจบรอบก่อน';
      if(sumWallets(st)!==0) return 'ต้องคืนเงินทุกคนเข้า BANK ก่อน';
      return null;
    }
    case 'REVERSAL': {
      if(!isAdmin(me_)) return 'เฉพาะ Admin';
      return null;
    }
  }
  return null;
}

/* --- apply: เปลี่ยน state (เรียกหลัง validate ผ่านแล้วเท่านั้น) --- */
function apply(st, ev){
  switch(ev.t){
    case 'ROOM_CREATED': {
      st.room = {code:ev.code,name:ev.name,ownerId:ev.by,status:'ACTIVE',maxSeats:ev.maxSeats,
                 settings:ev.settings,createdAt:ev.at};
      st.members[ev.by] = {id:ev.by,name:ev.name2,role:'ADMIN',seatNo:1,status:'PLAYING',color:AVCOLORS[0]};
      ensureWallet(st,ev.by);
      feed(st,ev,'🏠','สร้างห้อง "'+ev.name+'"','n');
      break;
    }
    case 'MEMBER_JOINED': {
      const n = Object.keys(st.members).length;
      st.members[ev.mid] = {id:ev.mid,name:ev.name,role:'SPECTATOR',seatNo:null,status:'WATCHING',color:AVCOLORS[n%AVCOLORS.length]};
      ensureWallet(st,ev.mid);
      feed(st,ev,'👋',ev.name+' เข้ามาดูในห้อง','n');
      break;
    }
    case 'JOIN_REQUESTED': {
      st.members[ev.by].status='PENDING_JOIN';
      st.requests[ev.id]={id:ev.id,type:'JOIN',by:ev.by,from:null,to:ev.by,amount:0,
        approver:'ADMIN',status:'PENDING',at:ev.at,note:''};
      break;
    }
    case 'JOIN_APPROVED': {
      const m = st.members[ev.mid];
      m.status='PLAYING'; m.role = m.role==='SPECTATOR'?'PLAYER':m.role;
      const taken = Object.values(st.members).map(x=>x.seatNo).filter(Boolean);
      let s=1; while(taken.includes(s)) s++;
      m.seatNo = s;
      for(const k in st.requests) if(st.requests[k].type==='JOIN'&&st.requests[k].to===ev.mid&&st.requests[k].status==='PENDING') st.requests[k].status='APPROVED';
      if(ev.amount>0){
        const w = ensureWallet(st,ev.mid);
        w.balance+=ev.amount; w.issuedIn+=ev.amount; st.bank.issued+=ev.amount;
        pushTx(st,ev,'ISSUE_INITIAL','BANK','W:'+ev.mid,ev.amount,'เงินเริ่มต้น');
        feed(st,ev,'✅',m.name+' เข้าร่วมวง (รับเงินเริ่มต้น ฿'+fmtS(ev.amount)+')','g');
      } else feed(st,ev,'✅',m.name+' เข้าร่วมวง','g');
      // เข้ากลางรอบ -> พักรอบนี้
      if(st.curRound && st.curRound.status==='OPEN' && !seatOf(st.curRound,ev.mid))
        st.curRound.seats.push({memberId:ev.mid,pos:st.curRound.seats.length+1,state:'SITTING_OUT',contributed:0,acted:true,tier:null,lastKind:null});
      break;
    }
    case 'JOIN_REJECTED': {
      const m = st.members[ev.mid]; if(m) m.status='WATCHING';
      for(const k in st.requests) if(st.requests[k].type==='JOIN'&&st.requests[k].to===ev.mid&&st.requests[k].status==='PENDING'){ st.requests[k].status='REJECTED'; st.requests[k].reason=ev.reason||''; }
      break;
    }
    case 'ISSUE': {
      const w = ensureWallet(st,ev.mid);
      w.balance+=ev.amount; w.issuedIn+=ev.amount; st.bank.issued+=ev.amount;
      pushTx(st,ev,ev.kind||'TOPUP_GRANT','BANK','W:'+ev.mid,ev.amount,ev.note);
      feed(st,ev,'📤','เบิกจาก BANK → '+nameOf(st,ev.mid)+' ฿'+fmtS(ev.amount),'g');
      st.pending_ack = st.pending_ack||{};
      break;
    }
    case 'RETURN_TO_BANK': {
      const w = st.wallets[ev.mid];
      w.balance-=ev.amount; w.returnedOut+=ev.amount; st.bank.returned+=ev.amount;
      pushTx(st,ev,'RETURN_TO_BANK','W:'+ev.mid,'BANK',ev.amount,ev.note);
      feed(st,ev,'📥',nameOf(st,ev.mid)+' คืนเงินเข้า BANK ฿'+fmtS(ev.amount),'n');
      break;
    }
    case 'TOPUP_REQUESTED': {
      st.requests[ev.id]={id:ev.id,type:'TOPUP',by:ev.by,from:null,to:ev.by,amount:ev.amount,
        approver:'ADMIN',status:'PENDING',at:ev.at,note:ev.note||''};
      break;
    }
    case 'BORROW_REQUESTED': {
      st.requests[ev.id]={id:ev.id,type:'BORROW',by:ev.by,from:ev.from,to:ev.to,amount:ev.amount,
        approver:ev.from,status:'PENDING',at:ev.at,note:ev.note||''};
      break;
    }
    case 'REQ_APPROVED': {
      const rq = st.requests[ev.rid]; rq.status='APPROVED'; rq.by2=ev.by;
      if(rq.type==='TOPUP'){
        const w = ensureWallet(st,rq.to);
        w.balance+=rq.amount; w.issuedIn+=rq.amount; st.bank.issued+=rq.amount;
        pushTx(st,ev,'TOPUP_REQUEST','BANK','W:'+rq.to,rq.amount,rq.note);
        feed(st,ev,'💰',nameOf(st,rq.to)+' เติมเงิน ฿'+fmtS(rq.amount),'g');
      } else if(rq.type==='BORROW'){
        const a=st.wallets[rq.from], b=ensureWallet(st,rq.to);
        a.balance-=rq.amount; b.balance+=rq.amount;
        pushTx(st,ev,'TRANSFER_BORROW','W:'+rq.from,'W:'+rq.to,rq.amount,rq.note);
        st.debts[ev.id]={id:ev.id,debtor:rq.to,creditor:rq.from,principal:rq.amount,outstanding:rq.amount,status:'OPEN'};
        feed(st,ev,'🤝',nameOf(st,rq.from)+' ให้ '+nameOf(st,rq.to)+' ยืมเงิน ฿'+fmtS(rq.amount),'n');
      }
      break;
    }
    case 'REQ_REJECTED': {
      const rq = st.requests[ev.rid]; rq.status='REJECTED'; rq.reason=ev.reason||'';
      if(rq.type==='JOIN'){ const m=st.members[rq.to]; if(m) m.status='WATCHING'; }
      break;
    }
    case 'TRANSFER': {
      const a=st.wallets[ev.from], b=ensureWallet(st,ev.to);
      a.balance-=ev.amount; b.balance+=ev.amount;
      pushTx(st,ev,ev.kind||'TRANSFER_GIVE','W:'+ev.from,'W:'+ev.to,ev.amount,ev.note);
      if(ev.kind==='DEBT_REPAY'){
        for(const k in st.debts){ const d=st.debts[k];
          if(d.status==='OPEN'&&d.debtor===ev.from&&d.creditor===ev.to){
            const pay=Math.min(d.outstanding,ev.amount); d.outstanding-=pay;
            if(d.outstanding<=0) d.status='SETTLED';
          }
        }
        feed(st,ev,'↩️',nameOf(st,ev.from)+' คืนหนี้ '+nameOf(st,ev.to)+' ฿'+fmtS(ev.amount),'n');
      } else {
        feed(st,ev,'💸',nameOf(st,ev.from)+' โอนเงินให้ '+nameOf(st,ev.to)+' ฿'+fmtS(ev.amount),'n');
      }
      break;
    }
    case 'ROUND_OPENED': {
      const idx = st.rounds.length+1;
      const seats = Object.values(st.members).filter(m=>m.status==='PLAYING')
        .sort((a,b)=>a.seatNo-b.seatNo)
        .map((m,i)=>({memberId:m.id,pos:i+1,state:'IN',ante:0,contributed:0,paid:0,acted:false,tier:null,lastKind:null}));
      const ante = st.room.settings.anteAmount||0;
      // ผู้เริ่ม = คนที่ได้เงินรอบก่อน ถ้าไม่มี/ไม่อยู่แล้ว → คนตำแหน่งแรก
      const startSeat = (st.lastWinnerId && seats.find(s=>s.memberId===st.lastWinnerId)) || seats[0] || null;
      const r = {id:ev.id,index:idx,status:'OPEN',phase: ante>0?'ANTE':'BETTING',
                 anteAmount:ante, pot:0,totalIn:0,currentBet:0,tiers:[],seats,
                 street:1, streets:[],
                 starterId: startSeat?startSeat.memberId:null,
                 turn: ante>0 ? null : (startSeat?startSeat.memberId:null),
                 complete:false,log:[], openedAt:ev.at,winners:[]};
      st.rounds.push(r); st.curRound=r;
      const who = startSeat?nameOf(st,startSeat.memberId):'—';
      feed(st,ev,'🟢','เปิดรอบที่ '+idx+(ante>0?' — ลงกองกลางคนละ ฿'+fmtS(ante):'')+' · เริ่มที่ '+who,'g');
      break;
    }
    case 'ANTE': {
      const r=st.curRound, s=seatOf(r,ev.by), w=st.wallets[ev.by];
      w.balance-=r.anteAmount; w.totalBet+=r.anteAmount;
      r.pot+=r.anteAmount; r.totalIn+=r.anteAmount;
      s.ante=r.anteAmount;
      pushTx(st,{...ev,roundId:r.id},'ANTE','W:'+ev.by,'POT:'+r.id,r.anteAmount,'ลงกองกลาง');
      feed(st,ev,'🪙',nameOf(st,ev.by)+' ลงกองกลาง ฿'+fmtS(r.anteAmount)+' · กองรวม ฿'+fmtS(r.pot),'n');
      maybeStartBetting(st,r,ev);
      break;
    }
    case 'ANTE_SITOUT': {
      const r=st.curRound, s=seatOf(r,ev.by);
      s.state='SITTING_OUT'; s.acted=true;
      feed(st,ev,'💤',nameOf(st,ev.by)+' ไม่ลงกองกลาง — พักรอบนี้','n');
      maybeStartBetting(st,r,ev);
      break;
    }
    case 'ADMIN_TRANSFERRED': {
      const from=st.members[ev.by], to=st.members[ev.mid];
      from.role='PLAYER'; to.role='ADMIN'; st.room.ownerId=ev.mid;
      feed(st,ev,'👑','โอนสิทธิ์ Admin จาก '+from.name+' ให้ '+to.name,'y');
      break;
    }
    case 'BET': {
      const r=st.curRound, s=seatOf(r,ev.by), w=st.wallets[ev.by];
      const cost = ev.amount - s.contributed;
      const isRaise = ev.amount > r.currentBet;
      w.balance-=cost; w.totalBet+=cost;
      r.pot+=cost; r.totalIn+=cost;
      s.contributed = ev.amount; s.acted = true; s.lastKind = isRaise?'RAISE':'CALL';
      let t = r.tiers.findIndex(x=>x.amount===ev.amount);
      if(t<0){ r.tiers.push({amount:ev.amount,color:TIER_COLORS[r.tiers.length%TIER_COLORS.length],ink:TIER_INK[r.tiers.length%TIER_INK.length]}); t=r.tiers.length-1; }
      s.tier=t;
      if(isRaise){
        r.currentBet = ev.amount;
        // ขึ้นเดิมพัน = ทุกคนที่เหลือต้องกลับมาตัดสินใจใหม่
        r.seats.forEach(x=>{ if(x.state==='IN' && x.memberId!==ev.by) x.acted=false; });
      }
      r.log.push({pos:s.pos,level:ev.amount,kind:isRaise?'RAISE':'CALL',by:ev.by});
      pushTx(st,{...ev,roundId:r.id},'BET','W:'+ev.by,'POT:'+r.id,cost,isRaise?'ขึ้นเป็น ฿'+fmtS(ev.amount):'ตาม ฿'+fmtS(ev.amount));
      feed(st,ev,'🎲',nameOf(st,ev.by)+(isRaise?' ขึ้นเดิมพันเป็น ':' ตาม ')+'฿'+fmtS(ev.amount)+
        (cost!==ev.amount?' (จ่ายเพิ่ม ฿'+fmtS(cost)+')':'')+' · กองรวม ฿'+fmtS(r.pot),'n');
      afterAction(st,r,ev,s.pos);
      break;
    }
    case 'FOLD': {
      const r=st.curRound, s=seatOf(r,ev.by);
      s.state='FOLDED'; s.acted=true; s.lastKind='FOLD';
      r.log.push({pos:s.pos,level:s.contributed,kind:'FOLD',by:ev.by});
      feed(st,ev,'🃏',nameOf(st,ev.by)+' หมอบการ์ด','n');
      afterAction(st,r,ev,s.pos);
      break;
    }
    case 'CHECK': {
      const r=st.curRound, s=seatOf(r,ev.by);
      s.acted=true; s.lastKind='CHECK';
      r.log.push({pos:s.pos,level:s.contributed,kind:'CHECK',by:ev.by});
      feed(st,ev,'⏭',nameOf(st,ev.by)+' ผ่าน'+(s.contributed>0?' (ลงไว้ ฿'+fmtS(s.contributed)+')':' (ลง 0)'),'n');
      afterAction(st,r,ev,s.pos);
      break;
    }
    case 'SEATS_REORDER': {
      const r = st.curRound;
      ev.order.forEach((mid,i)=>{ const m=st.members[mid]; if(m) m.seatNo=i+1;
        if(r && r.status==='OPEN'){ const s=seatOf(r,mid); if(s) s.pos=i+1; } });
      if(r && r.status==='OPEN' && r.turn && !needsAct(r,seatOf(r,r.turn)||{state:'x'}))
        r.turn = nextTurn(r, 0);
      feed(st,ev,'🔀','Admin จัดลำดับที่นั่งใหม่','n');
      break;
    }
    case 'ROUND_LOCK': st.curRound.status='LOCKED'; feed(st,ev,'🔒','ปิดรับลงเงิน รอบที่ '+st.curRound.index,'n'); break;
    case 'ROUND_UNLOCK': st.curRound.status='OPEN'; feed(st,ev,'🔓','เปิดรับลงเงินอีกครั้ง','n'); break;
    case 'ROUND_VOID': {
      const r=st.curRound;
      r.seats.forEach(s=>{
        const back = paidTotal(s);      // คืนทั้งกองกลางและเงินเดิมพันทุกรอบ
        if(back>0){ const w=st.wallets[s.memberId];
          w.balance+=back; w.totalBet-=back; r.pot-=back;
          pushTx(st,{...ev,roundId:r.id},'UNBET','POT:'+r.id,'W:'+s.memberId,back,'ยกเลิกรอบ'); }
        s.contributed=0; s.ante=0; s.paid=0; s.tier=null;
        s.state='IN'; s.acted=false; s.lastKind=null; });
      r.currentBet=0; r.tiers=[]; r.log=[]; r.street=1; r.streets=[];
      r.status='VOIDED'; r.turn=null; r.complete=false;
      feed(st,ev,'✖','ยกเลิกรอบที่ '+r.index+' คืนเงินทุกคนแล้ว','y');
      break;
    }
    case 'PAYOUT': {
      const r=st.curRound;
      ev.winners.forEach(wn=>{ if(wn.amount<=0) return;
        const w=ensureWallet(st,wn.memberId);
        w.balance+=wn.amount; w.totalWon+=wn.amount; r.pot-=wn.amount;
        pushTx(st,{...ev,roundId:r.id},'PAYOUT','POT:'+r.id,'W:'+wn.memberId,wn.amount,'');
      });
      r.winners=ev.winners.filter(w=>w.amount>0); r.status='SETTLED'; r.settledAt=ev.at;
      // 🏆 คนที่ได้เงินมากสุดรอบนี้ = ผู้เริ่มของรอบถัดไป
      if(r.winners.length){
        // Admin เลือกได้ว่าผู้ชนะคนไหนเริ่มรอบถัดไป · ไม่ได้เลือก = คนที่ได้เงินมากสุด
        st.lastWinnerId = ev.startNextId || r.winners.slice().sort((a,b)=>b.amount-a.amount)[0].memberId;
        r.startNextId = st.lastWinnerId;
      }
      const names = r.winners.map(w=>nameOf(st,w.memberId)+' ฿'+fmtS(w.amount)).join(' · ');
      feed(st,ev,'🏆','จบรอบที่ '+r.index+(names?' — '+names:' (ไม่มีเงินในกอง)'),'g');
      break;
    }
    case 'SEATS_SET': st.room.maxSeats=ev.n; break;
    case 'MEMBER_REMOVED': {
      const m=st.members[ev.mid]; if(m){ m.status='LEFT'; m.seatNo=null; m.role='SPECTATOR'; }
      if(st.curRound&&st.curRound.status==='OPEN'){ const s=seatOf(st.curRound,ev.mid); if(s&&s.state==='IN') s.state='SITTING_OUT'; }
      feed(st,ev,'🚪',(m?m.name:'ผู้เล่น')+' ออกจากวง','n');
      break;
    }
    case 'SETTINGS_SET': Object.assign(st.room.settings, ev.settings); if(ev.roomName) st.room.name=ev.roomName; break;
    case 'ROOM_CLOSED': st.room.status='CLOSED'; st.room.closedAt=ev.at; feed(st,ev,'🏁','ปิดห้องแล้ว','n'); break;
    case 'REVERSAL': {
      const orig = st.txs.find(t=>t.id===ev.txId || t.seq===ev.seqNo);
      if(!orig) break;
      const mv=(acc,delta)=>{ if(acc==='BANK'){ if(delta>0) st.bank.issued+=delta; else st.bank.returned+= -delta; }
        else if(acc.startsWith('W:')){ ensureWallet(st,acc.slice(2)).balance+=delta; }
        else if(acc.startsWith('POT:')&&st.curRound){ st.curRound.pot+=delta; } };
      mv(orig.from, orig.amount); mv(orig.to, -orig.amount);
      pushTx(st,ev,'REVERSAL',orig.to,orig.from,orig.amount,'กลับรายการ #'+orig.seq+' — '+(ev.reason||''));
      feed(st,ev,'↩️','กลับรายการ #'+orig.seq+' ฿'+fmtS(orig.amount)+' — '+(ev.reason||''),'y');
      break;
    }
  }
}

function reduce(events){
  const st = blankState();
  st.rejected = [];
  for(const ev of events){
    const err = validate(st,ev);
    if(err){ st.rejected.push({ev,err}); continue; }
    try{ apply(st,ev); }catch(e){ st.rejected.push({ev,err:'apply error: '+e.message}); }
  }
  // invariant I-1
  const lhs = sumWallets(st)+potNow(st), rhs = netIssued(st);
  st.broken = (lhs!==rhs) ? {lhs,rhs,diff:lhs-rhs} : null;
  return st;
}

/* ============================================================
   STORE — ชั้นซิงก์
   ============================================================ */
const Store = {
  mode:'local', code:null, events:[], bc:null, sb:null, chan:null, onChange:null, online:false,
  key(){ return 'pk:room:'+this.code; },

  async open(code, mode, cfg){
    this.close(); this.code=code; this.mode=mode||'local'; this.events=[];
    if(this.mode==='local'){
      try{ this.events = JSON.parse(LS.get(this.key())||'[]'); }catch(e){ this.events=[]; }
      this.bc = safeChannel('pk:'+code);
      this.bc.onmessage = () => { try{ this.events = JSON.parse(LS.get(this.key())||'[]'); }catch(e){} this.onChange && this.onChange(); };
      this.online = true;
      this.onChange && this.onChange();
      return;
    }
    /* ---- Supabase ---- */
    this.sb = await getSupabase(cfg);
    const {data,error} = await this.sb.from(SB_TABLE).select('id,event').eq('room_code',code).order('id',{ascending:true});
    if(error) throw new Error('อ่านข้อมูลห้องไม่ได้: '+error.message);
    this.events = (data||[]).map(r=>{ const e=r.event; e._ord=r.id; return e; });
    this.lastId = data && data.length ? data[data.length-1].id : 0;

    // ช่องทางที่ 1: Realtime (เร็วที่สุด — ได้ทันทีเป็นวินาที)
    this.chan = this.sb.channel('pk-'+code)
      .on('postgres_changes',
          {event:'INSERT',schema:'public',table:SB_TABLE,filter:'room_code=eq.'+code},
          payload => {
            const row = payload.new; if(!row || !row.event) return;
            if(row.id && row.id>this.lastId) this.lastId = row.id;
            const ex = this.events.find(e=>e.id===row.event.id);
            if(ex){ ex._ord = row.id; this.sortEv(); this.onChange && this.onChange(); return; }  // echo ของตัวเอง → ใส่เลขลำดับให้
            row.event._ord = row.id;
            this.events.push(row.event); this.sortEv(); this.onChange && this.onChange();
          })
      .subscribe(s => { this.rt = (s==='SUBSCRIBED'); this.online = true; render(); });

    // ช่องทางที่ 2: ดึงซ้ำทุก 4 วินาที — กันกรณี Realtime ไม่ทำงาน (เช่นยังไม่ได้เปิด publication)
    this.poll = setInterval(()=>this.pull(), 4000);
    this.online = true;
    this.onChange && this.onChange();
  },

  /** เรียง event ตามลำดับกลางของฐานข้อมูล — ทุกเครื่องต้องเห็นลำดับเดียวกันเป๊ะ
      (ตัวที่เพิ่งส่งและยังไม่รู้เลขลำดับ ไปอยู่ท้ายชั่วคราว) */
  sortEv(){
    this.events.sort((a,b)=>{
      const ao = a._ord ?? Number.MAX_SAFE_INTEGER, bo = b._ord ?? Number.MAX_SAFE_INTEGER;
      if(ao !== bo) return ao - bo;
      if(a.at !== b.at) return a.at - b.at;
      return String(a.id) < String(b.id) ? -1 : 1;
    });
  },

  /** ดึงเฉพาะ event ที่ใหม่กว่าที่มีอยู่ */
  async pull(){
    if(this.mode!=='cloud' || !this.sb || this.pulling) return;
    this.pulling = true;
    try{
      const {data,error} = await this.sb.from(SB_TABLE)
        .select('id,event').eq('room_code',this.code).gt('id',this.lastId).order('id',{ascending:true});
      if(error){ this.online=false; return; }
      this.online = true;
      let changed = false;
      for(const r of (data||[])){
        if(r.id>this.lastId) this.lastId = r.id;
        const ex = this.events.find(e=>e.id===r.event.id);
        if(ex){ if(ex._ord==null){ ex._ord=r.id; changed=true; } }
        else { r.event._ord=r.id; this.events.push(r.event); changed = true; }
      }
      if(changed){ this.sortEv(); this.onChange && this.onChange(); }
    } finally { this.pulling = false; }
  },

  async append(ev){
    ev.id = ev.id || uid(); ev.at = ev.at || nowT(); ev.by = ev.by || me.id;
    if(this.mode==='local'){
      let arr=[]; try{ arr = JSON.parse(LS.get(this.key())||'[]'); }catch(e){}
      arr.push(ev); LS.set(this.key(), JSON.stringify(arr));
      this.events = arr;
      const idx = JSON.parse(LS.get('pk:rooms')||'[]');
      if(!idx.includes(this.code)){ idx.push(this.code); LS.set('pk:rooms',JSON.stringify(idx)); }
      this.bc && this.bc.postMessage('u');
      this.onChange && this.onChange();
      return;
    }
    this.events.push(ev);                    // แสดงผลทันที ไม่รอ network
    this.onChange && this.onChange();
    const {data,error} = await this.sb.from(SB_TABLE)
      .insert({room_code:this.code, event:{...ev, _ord:undefined}}).select('id');
    if(error){
      this.events = this.events.filter(e=>e.id!==ev.id);   // ส่งไม่สำเร็จ → ย้อนกลับ
      this.onChange && this.onChange();
      toast('ส่งข้อมูลไม่สำเร็จ: '+error.message,'r');
      throw error;
    }
    if(data && data[0]){
      ev._ord = data[0].id;                  // ได้เลขลำดับกลางแล้ว → เรียงใหม่ให้ตรงกับทุกเครื่อง
      if(data[0].id>this.lastId) this.lastId = data[0].id;
      this.sortEv(); this.onChange && this.onChange();
    }
  },
  close(){
    if(this.bc){ this.bc.close(); this.bc=null; }
    if(this.chan && this.sb){ this.sb.removeChannel(this.chan); this.chan=null; }
    if(this.poll){ clearInterval(this.poll); this.poll=null; }
    this.online=false; this.rt=false;
  }
};
// กลับมาที่แท็บ/ปลดล็อกมือถือ → ดึงข้อมูลล่าสุดทันที ไม่ต้องรอรอบ poll
/* ---------- จัดการเมื่อหน้าเว็บถูกซ่อน/ปิด ----------
   แท็บที่ซ่อนหรือย่อไว้ต้องหยุดทุกอย่าง: ไม่ดึงข้อมูล ไม่ส่งเสียง ไม่สั่น */
function goQuiet(){
  stopNag();                       // หยุดเตือนซ้ำทุก 5 วิ
  Sfx.silence();                   // พักเครื่องเสียง เสียงที่คิวไว้ไม่ดัง
  if(Store.poll){ clearInterval(Store.poll); Store.poll=null; }
}
function goActive(){
  if(Sfx.killed) return;           // หน้านี้ถูกปิดไปแล้ว อย่าปลุกอะไรกลับมา
  if(Store.mode==='cloud' && Store.sb && Store.code && !Store.poll){
    Store.poll = setInterval(()=>Store.pull(), 4000);
    Store.pull();                  // ดึงทันทีให้ทันเพื่อน
  }
  updateTurnNag();                 // ถ้ายังถึงตาเราอยู่ ค่อยเริ่มเตือนใหม่
}
/** ปิดหน้าเว็บ/แช่แข็ง → ตัดเสียงถาวร ไม่ให้มีทางดังได้อีก */
function goDead(){ goQuiet(); Sfx.kill(); try{ Store.close(); }catch(e){} }

document.addEventListener('visibilitychange', ()=>{ document.hidden ? goQuiet() : goActive(); });
// หน้าต่างอยู่ข้างหลัง (ยังนับเป็น visible) → ต้องเงียบเหมือนกัน
window.addEventListener('blur',  goQuiet);
window.addEventListener('focus', goActive);
// มือถือ: สลับแอป / ปิดแท็บ / ระบบแช่แข็งหน้าเว็บ
window.addEventListener('pagehide', goDead);
window.addEventListener('beforeunload', goDead);
document.addEventListener('freeze', goDead);               // Chrome Page Lifecycle
document.addEventListener('resume', ()=>{ Sfx.killed=false; goActive(); });
// กลับมาจาก bfcache (กดย้อนกลับบนมือถือ) → เปิดเสียงใหม่ได้
window.addEventListener('pageshow', e=>{ if(e.persisted){ Sfx.killed=false; goActive(); } });

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('โหลดไม่สำเร็จ: '+src)); document.head.appendChild(s); }); }
let _sbClient = null;
async function getSupabase(cfg){
  cfg = cfg || sbCfg();
  if(!cfg || !cfg.url || !cfg.key) throw new Error('ยังไม่ได้ตั้งค่า Supabase');
  if(!window.supabase) await loadScript(SB_CDN);
  if(!_sbClient) _sbClient = window.supabase.createClient(cfg.url, cfg.key, {realtime:{params:{eventsPerSecond:20}}});
  return _sbClient;
}
/* ---- จำห้องล่าสุด: ปิดแอปแล้วเปิดใหม่ให้กลับเข้าห้องเดิม จนกว่าจะกด "ออกจากห้อง" ---- */
const LastRoom = {
  save(code, mode){ LS.set('pk:lastRoom', JSON.stringify({code, mode:mode||'local'})); },
  load(){ try{ const v=JSON.parse(LS.get('pk:lastRoom')||'null'); return (v&&v.code)?v:null; }catch(e){ return null; } },
  clear(){ LS.del('pk:lastRoom'); }

/** อ่าน config: ค่าที่ฝังไว้ในไฟล์ (ตอน deploy) ก่อน แล้วค่อยดูที่ผู้ใช้กรอกเอง */
function sbCfg(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, key:SUPABASE_ANON_KEY, baked:true};
  try{ const c = JSON.parse(LS.get('pk:sb')||'null'); return (c&&c.url&&c.key)?c:null; }catch(e){ return null; }
}

/* ============================================================
   COMMAND — validate ฝั่ง client ก่อนส่ง เพื่อโชว์ error ทันที
   ============================================================ */
let S = blankState();          // state ปัจจุบัน
let UI = { screen:'landing', tab:'control', modal:null, sel:null, form:{}, seen:0, theme:'dark' };

async function cmd(ev){
  ev.by = ev.by || me.id;
  const err = validate(S, {...ev, id:'probe', at:nowT()});
  if(err){ toast(err,'r'); return false; }
  await Store.append(ev);
  return true;
}

function refresh(){
  const prev = S;
  const firstLoad = !prev.room;              // เพิ่งเปิดห้อง — ไม่ต้องเด้งย้อนหลังทั้งหมด
  S = reduce(Store.events);
  notifyMyTurn(prev);
  updateTurnNag();
  if(firstLoad) initPopupMarks(); else maybePopups();
  if(!firstLoad && prev.feed && S.feed.length>prev.feed.length && UI.screen!=='landing'){
    const added = S.feed.slice(prev.feed.length).filter(f=>f.kind!=='silent');
    // แสดงแถบเดียวเสมอ — เอาเฉพาะรายการล่าสุด (อันใหม่แทนที่อันเก่าทันที ไม่ซ้อนกัน)
    if(added.length){
      const f = added[added.length-1];
      toast(f.icon+'  '+f.text+(added.length>1?'  (+'+(added.length-1)+' รายการ)':''), f.kind==='g'?'g':f.kind==='y'?'y':'');
    }
  }
  render();
}
Store.onChange = refresh;

const meM = () => S.members[me.id] || null;
const isAdmin = () => { const m=meM(); return !!m && (m.role==='ADMIN'||m.role==='CO_ADMIN'); };
const isPlayer = () => { const m=meM(); return !!m && m.status==='PLAYING'; };
const myWallet = () => S.wallets[me.id] || {balance:0,issuedIn:0,returnedOut:0};
const pendingForAdmin = () => Object.values(S.requests).filter(r=>r.status==='PENDING'&&r.approver==='ADMIN');
const pendingForMe = () => Object.values(S.requests).filter(r=>r.status==='PENDING'&&r.approver===me.id);
const playersList = () => Object.values(S.members).filter(m=>m.status==='PLAYING').sort((a,b)=>a.seatNo-b.seatNo);
/**
 * สรุปหนี้สิน "คงค้างตอนนี้" ของคนหนึ่งคน
 * นับเฉพาะที่ยังค้างอยู่จริง — คืนครบแล้วจะหายไปเลย ไม่เก็บเป็นประวัติ
 *   owes = ยืมคนอื่นมา (ยังติดเขาอยู่)  ·  lent = ให้คนอื่นยืมไป (รอรับคืน)
 */
function debtOf(mid){
  const owes={}, lent={};
  Object.values(S.debts).forEach(d=>{
    if(d.status!=='OPEN' || d.outstanding<=0) return;      // คืนหมดแล้ว = ไม่นับ
    if(d.debtor===mid)   owes[d.creditor] = (owes[d.creditor]||0) + d.outstanding;
    if(d.creditor===mid) lent[d.debtor]   = (lent[d.debtor]||0)   + d.outstanding;
  });
  const arr = o => Object.keys(o).map(k=>({id:k,amount:o[k]})).sort((a,b)=>b.amount-a.amount);
  const o=arr(owes), l=arr(lent);
  const sum = a => a.reduce((x,y)=>x+y.amount,0);
  return {owes:o, owesTotal:sum(o), lent:l, lentTotal:sum(l), net:sum(l)-sum(o)};
}
const anyDebts = () => Object.values(S.debts).some(d=>d.status==='OPEN'&&d.outstanding>0);

const profitOf = mid => {
  const w = S.wallets[mid]||{balance:0,issuedIn:0,returnedOut:0};
  const r = S.curRound && S.curRound.status!=='SETTLED' && S.curRound.status!=='VOIDED' ? S.curRound : null;
  const seat = r ? seatOf(r,mid) : null;
  const inPot = seat ? paidTotal(seat) : 0;   // เงินที่ยังค้างในกองถือเป็นของเจ้าตัวไว้ก่อน
  return w.balance + inPot - (w.issuedIn - w.returnedOut);
};

/** ส่งเสียง/สั่น เมื่อสถานะเปลี่ยนมาเป็น "ตาคุณ" หรือ "ต้องลงกองกลาง" หรือ "คุณชนะ" */
function notifyMyTurn(prev){
  const a = prev.curRound, b = S.curRound;
  if(!b || b.status!=='OPEN') { if(b && b.status==='SETTLED' && (!a||a.status!=='SETTLED')){
      const w=(b.winners||[]).find(x=>x.memberId===me.id); if(w) Sfx.win(); } return; }
  const seat = seatOf(b, me.id); if(!seat || seat.state!=='IN') return;

  const sameRound = !!(a && a.id===b.id);
  if(b.phase==='ANTE'){
    const need = seat.ante<=0;
    const wasNeed = sameRound && a.phase==='ANTE' && ((seatOf(a,me.id)||{}).ante||0)<=0;
    if(need && !wasNeed){ Sfx.ante(); toast('🪙 ถึงคิวลงเงินกองกลาง ฿'+fmtS(b.anteAmount),'y'); }
    return;
  }
  const mine = b.turn===me.id;
  const wasMine = !!(sameRound && a.phase==='BETTING' && a.turn===me.id && a.street===b.street);
  if(mine && !wasMine){ Sfx.myTurn(); toast('👉 ถึงตาคุณแล้ว!','y'); }
}

/* ---------- เตือนซ้ำทุก 5 วิ ถ้าถึงตาเราแล้วยังไม่กดลง ---------- */
let _nag = null;
function stopNag(){ if(_nag){ clearInterval(_nag); _nag=null; } }
function updateTurnNag(){
  const r = S.curRound, seat = r ? seatOf(r, me.id) : null;
  const anteDue = r && r.status==='OPEN' && seat && seat.state==='IN'
                  && r.phase==='ANTE' && seat.ante<=0;
  const betDue  = r && r.status==='OPEN' && seat && seat.state==='IN'
                  && r.phase==='BETTING' && r.turn===me.id && needsAct(r,seat);
  // เริ่มเตือนซ้ำได้เฉพาะตอนหน้าเว็บเปิดอยู่จริง
  const visible = (()=>{ try{ return document.visibilityState==='visible' && !document.hidden; }catch(e){ return true; } })();
  if((anteDue || betDue) && visible && !_nag){
    _nag = setInterval(()=>{
      // เช็คซ้ำก่อนดังทุกครั้ง — กันดังค้างหลังลงไปแล้ว หรือหน้าเว็บถูกซ่อนไป
      try{ if(document.visibilityState!=='visible' || document.hidden){ stopNag(); return; } }catch(e){}
      const rr = S.curRound, ss = rr ? seatOf(rr, me.id) : null;
      const stillAnte = rr && rr.status==='OPEN' && ss && ss.state==='IN' && rr.phase==='ANTE' && ss.ante<=0;
      const stillBet  = rr && rr.status==='OPEN' && ss && ss.state==='IN' && rr.phase==='BETTING' && rr.turn===me.id && needsAct(rr,ss);
      if(stillAnte) Sfx.ante();
      else if(stillBet) Sfx.myTurn();
      else stopNag();
    }, 5000);
  }
  if((!(anteDue || betDue) || !visible) && _nag) stopNag();
}

/* ---------- ป๊อปอัพอัตโนมัติ: สรุปผู้ชนะ (ทุกเครื่อง) + เปิดไพ่กลาง ---------- */
let sumAuto = true, sumSecs = 5, _sumTimer = null;

function scheduleSummaryClose(){
  clearTimeout(_sumTimer);
  if(!sumAuto) return;
  _sumTimer = setTimeout(()=>{
    if(UI.modal && (UI.modal.k==='summary' || UI.modal.k==='reveal')){ UI.modal=null; render(); }
  }, Math.max(2, sumSecs)*1000);
}

/* จำว่าเคยโชว์อะไรไปแล้ว — ไม่พึ่งการเทียบ snapshot เพราะเครื่องผู้เล่น
   มักได้ event มาเป็นชุด (poll ทุก 4 วิ) แล้วข้ามจังหวะ SETTLED ไปเลย */
let seenSettled = null, seenStreet = {};

/** ตั้งจุดเริ่มตอนเพิ่งเข้าห้อง — กันเด้งสรุปของรอบเก่าย้อนหลัง */
function initPopupMarks(){
  const done = S.rounds.filter(x=>x.status==='SETTLED');
  seenSettled = done.length ? done[done.length-1].id : null;
  seenStreet = {};
  if(S.curRound) seenStreet[S.curRound.id] = S.curRound.street;
}

function maybePopups(){
  if(UI.screen==='landing' || UI.screen==='boot') return;
  const busy = UI.modal && UI.modal.k!=='summary' && UI.modal.k!=='reveal';   // อย่าทับโมดัลที่ผู้ใช้เปิดค้างอยู่

  // 1) มีรอบที่จบแล้วแต่ยังไม่เคยโชว์ → เด้งสรุปผู้ชนะทุกเครื่อง
  //    (หาจากรายการรอบทั้งหมด ไม่ใช่ curRound — Admin อาจเปิดรอบใหม่ไปแล้ว)
  const done = S.rounds.filter(x=>x.status==='SETTLED');
  const last = done.length ? done[done.length-1] : null;
  if(last && seenSettled !== last.id){
    seenSettled = last.id;
    if(!busy){ UI.modal={k:'summary',round:last}; scheduleSummaryClose(); render(); return; }
    toast('🏁 จบรอบที่ '+last.index+' — '+(last.winners||[]).map(w=>nameOf(S,w.memberId)).join(' · ')+' ชนะ','g');
  }

  // 2) ขึ้นรอบลงเงินใหม่ที่ยังไม่เคยโชว์ → เปิดไพ่กลาง (2=เปิด 3 ใบ, 3=ใบที่ 4, 4=ใบที่ 5)
  const b = S.curRound;
  if(b && b.status==='OPEN' && b.phase==='BETTING' && b.street>=2 && b.street<=4){
    const shown = seenStreet[b.id] || 1;
    if(b.street > shown){
      seenStreet[b.id] = b.street;
      if(!busy){ UI.modal={k:'reveal',street:b.street}; scheduleSummaryClose(); Sfx.chip(); render(); }
      else toast('🃏 จบรอบลงเงินที่ '+(b.street-1)+' — เปิดไพ่กลางได้','y');
    }
  } else if(b && !seenStreet[b.id]) seenStreet[b.id] = b.street;
}

const TOAST_MAX = 1;                       // แถบเดียวเสมอ — อันใหม่แทนที่อันเก่า ไม่ซ้อนกัน
function toast(text, kind){
  const box = $('#toasts'); if(!box) return;
  while(box.children.length >= TOAST_MAX) box.removeChild(box.firstChild);   // อันเก่าสุดหลุดไปก่อน
  const el = document.createElement('div');
  el.className = 'toast '+(kind||'');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 2600);
}

function render(){
  const app = $('#app');
  let html='';
  if(UI.screen==='boot') html = vBoot();
  else if(UI.screen==='landing') html = vLanding();
  else if(UI.screen==='create') html = vCreate();

  else html = vRoom();
  app.innerHTML = html;

}

/* ============================================================
   ปุ่มลอยของ Admin (แท็บ "เล่นด้วย") — กดค้างลากย้ายได้ · แตะเพื่อเปิดเมนูจัดการรอบ
   อยู่นอก #app จึงไม่ถูกล้างตอน re-render และไม่หลุดมือขณะลาก
   ============================================================ */
let fabEl = null;
function fabPos(){ try{ const v=JSON.parse(LS.get('pk:fab')||'null'); return (v&&v.x!=null)?v:null; }catch(e){ return null; } }
const vpW = () => window.innerWidth  || document.documentElement.clientWidth  || 390;
const vpH = () => window.innerHeight || document.documentElement.clientHeight || 780;
function placeFab(){
  if(!fabEl) return;
  const W = vpW(), H = vpH();
  if(W<80 || H<80) return;                    // จอยังวัดไม่ได้ (แท็บซ่อนอยู่) — อย่าเพิ่งจัดตำแหน่ง
  const p = fabPos();
  const x = p ? Math.min(p.x, W-62) : W-72;
  const y = p ? Math.min(p.y, H-62) : H-150;
  fabEl.style.left = Math.max(6,x)+'px';
  fabEl.style.top  = Math.max(6,y)+'px';
}
function renderFab(){
  const box = document.getElementById('fab'); if(!box) return;
  const show = S.room && S.room.status!=='CLOSED' && isAdmin()
            && UI.screen==='home' && !UI.modal;      // แสดงทุกแท็บของหน้าห้อง
  if(!show){ box.innerHTML=''; fabEl=null; return; }
  if(fabEl && document.getElementById('fabBtn')) return;   // เช็ค DOM จริง กัน cache ค้างแล้วปุ่มหาย
  fabEl = null;
  box.innerHTML = '<button class="fab" id="fabBtn" title="จัดการรอบ">👑</button>';
  fabEl = document.getElementById('fabBtn');
  placeFab();
  bindFabDrag();
}
function bindFabDrag(){
  let moved=false, sx=0, sy=0, ox=0, oy=0;
  fabEl.addEventListener('pointerdown', e=>{
    e.preventDefault();                       // กันไม่ให้เบราว์เซอร์สร้าง event ซ้อน
    moved=false; sx=e.clientX; sy=e.clientY;
    const r=fabEl.getBoundingClientRect(); ox=r.left; oy=r.top;
    fabEl.setPointerCapture(e.pointerId);
  });
  fabEl.addEventListener('pointermove', e=>{
    if(!fabEl.hasPointerCapture(e.pointerId)) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.abs(dx)<5 && Math.abs(dy)<5) return;   // ขยับนิดเดียว = ยังนับเป็นการแตะ
    moved=true; fabEl.classList.add('dragging');
    fabEl.style.left = Math.max(6, Math.min(vpW()-62, ox+dx))+'px';
    fabEl.style.top  = Math.max(6, Math.min(vpH()-62, oy+dy))+'px';
  });
  const end = e=>{
    if(fabEl.hasPointerCapture(e.pointerId)) fabEl.releasePointerCapture(e.pointerId);
    fabEl.classList.remove('dragging');
    if(moved){
      if(vpW()>80) LS.set('pk:fab', JSON.stringify({x:parseFloat(fabEl.style.left), y:parseFloat(fabEl.style.top)}));
      return;                                  // ลากแล้ว = ไม่ใช่การแตะ ไม่เปิดเมนู
    }
    /* แตะเฉยๆ → เปิดเมนู
       ต้องรอให้ event ชุดนี้จบก่อนค่อย render มิฉะนั้นปุ่มจะถูกลบทิ้งกลางคัน
       แล้ว click ที่ตามมาจะไปตกใส่ปุ่มในเมนูที่เพิ่งขึ้นมาแทน (เคยทำให้เด้งไปหน้าคุมห้องเอง) */
    setTimeout(()=>{ UI.modal={k:'adminQuick'}; render(); }, 0);
  };
  fabEl.addEventListener('pointerup', end);
  fabEl.addEventListener('pointercancel', ()=>{ fabEl.classList.remove('dragging'); });
  // กัน click ที่เบราว์เซอร์ยิงตามหลัง pointerup ไม่ให้ทะลุไปโดนอย่างอื่น
  fabEl.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); });
}
window.addEventListener('resize', ()=>{ if(fabEl) placeFab(); });

/* ---------- room shell ---------- */
function vRoom(){
  const scr = UI.screen;
  let body='';
  if(scr==='approvals') body = vApprovals();
  else if(scr==='players') body = vPlayers();
  else if(scr==='history') body = vHistory();
  else if(scr==='settings') body = vSettings();
  else if(scr==='payout') return vPayout();
  else if(scr==='settle') return vSettle();
  else if(scr==='wallet') body = vWallet();
  else body = isAdmin() ? vAdminHome() : (isPlayer() ? vPlayerHome() : vSpectator());
  // แถบแท็บ Admin ตรึงติด top bar (เฉพาะหน้าห้อง)
  const sub = (scr==='home' && isAdmin())
    ? `<div class="subbar"><div class="tabs">
        <button class="${UI.tab==='control'?'on':''}" data-act="tab" data-t="control">👑 คุมห้อง</button>
        <button class="${UI.tab==='play'?'on':''}" data-act="tab" data-t="play">🎮 เล่นด้วย</button>
      </div></div>` : '';
  // ขอบจอกระพริบเขียวเมื่อถึงตาเรา (เดิมพัน) หรือถึงคิวลงกองกลาง
  const r = S.curRound;
  const seat = r?seatOf(r,me.id):null;
  // ติดเฉพาะเครื่องของคนที่ "ถึงตา" จริงๆ ทีละคนเท่านั้น (r.turn ชี้คนเดียวเสมอ)
  const myGo = r && r.status==='OPEN' && seat && seat.state==='IN' &&
    ( (r.phase==='ANTE' && seat.ante<=0) ||
      (r.phase==='BETTING' && r.turn===me.id && needsAct(r,seat)) );
  return vHeader() + sub + `<div class="body">${body}</div>` + vFooterAction() + vNav()
    + (myGo?'<div class="glow"></div>':'');
}
