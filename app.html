/** แถบรายละเอียดกองแบบย่อ ใช้คู่กับโต๊ะ (ยอดใหญ่อยู่กลางโต๊ะแล้ว ไม่แสดงซ้ำ) */
function potDetails(r){
  if(!r) return '';
  const anteSum = r.seats.reduce((a,s)=>a+(s.ante||0),0);
  const curSum  = r.seats.reduce((a,s)=>a+(s.contributed||0),0);
  const multi = (r.streets&&r.streets.length) || (S.room.settings.multiStreet && r.phase==='BETTING');
  const note = actionNotation(r);
  if(!multi && !note) return '';
  return `<div class="card col" style="gap:6px;padding:8px 11px">
    ${multi?`<div class="streets" style="margin:0">
      ${anteSum?`<span class="st done"><i>ลงกอง</i><b class="num">฿${fmtS(anteSum)}</b></span>`:''}
      ${(r.streets||[]).map(x=>`<span class="st done"><i>รอบ ${x.index}</i><b class="num">฿${fmtS(x.total)}</b></span>`).join('')}
      <span class="st now"><i>รอบ ${r.street} ▶</i><b class="num">฿${fmtS(curSum)}</b></span>
    </div>`:''}
    ${note?`<div class="notation num">${esc(note)}</div>`:''}
  </div>`;
}

/* ---------- โต๊ะโป๊กเกอร์ — ผู้เล่นเรียงรอบวงรี กองกลางอยู่กลางโต๊ะ ---------- */
function seatVisual(r, s){
  // คืนข้อมูลการแสดงผลของที่นั่ง (ใช้ร่วมกันทั้งโต๊ะและแถวแบบเดิม)
  const m = S.members[s.memberId]; if(!m) return null;
  const isMe = s.memberId===me.id;
  const isTurn = r.turn===s.memberId && r.status==='OPEN';
  let ring='var(--border)', badge='', bstyle='', cls='';
  if(s.state==='FOLDED'){ cls='fold'; badge='หมอบ'; }
  else if(s.state==='SITTING_OUT'){ cls='fold'; badge='พัก'; }
  else if(r.phase==='ANTE'){
    if(s.ante>0){ ring='var(--pot)'; badge='฿'+fmtS(s.ante); bstyle='background:var(--pot);color:#241705;border-color:var(--pot)'; }
    else { badge='รอลงกอง'; if(s.memberId===r.starterId) ring='var(--pending)'; }
  }
  else if(s.contributed>0){
    const t=r.tiers[s.tier]||{color:'var(--border)',ink:'#000'}; ring=t.color;
    badge='฿'+fmtS(s.contributed); bstyle=`background:${t.color};color:${t.ink};border-color:${t.color}`;
    if(needsAct(r,s)) badge += ' ↑';
  }
  else if(s.acted && !needsAct(r,s)){ badge='ผ่าน'; }
  else { badge = isTurn?(isMe?'ตาคุณ':'ตานี้'):'รอลง'; if(m.role==='ADMIN'||m.role==='CO_ADMIN') ring='var(--admin)'; }
  if(isMe && s.state==='IN') cls+=' me';
  if(isTurn) cls+=' turn';
  const face = (m.role==='ADMIN'||m.role==='CO_ADMIN') ? '👑' : (isMe?'คุณ':esc(initials(m.name)));
  return {m,isMe,isTurn,ring,badge,bstyle,cls,face};
}

function pokerTable(r){
  if(!r) return '';
  const seats = r.seats.filter(s=>s.state!=='SITTING_OUT')
                       .slice().sort((a,b)=>a.pos-b.pos);
  if(!seats.length) return '';
  // หมุนให้ "คุณ" อยู่ล่างสุดกลางจอเสมอ (ถ้าเราอยู่ในวง)
  const myIdx = seats.findIndex(s=>s.memberId===me.id);
  const start = myIdx>=0 ? myIdx : 0;
  const n = seats.length;
  const spots = seats.map((s,i)=>{
    const k = (i - start + n) % n;                 // 0 = ตัวเอง (ล่างกลาง) แล้ววนตามเข็ม
    const ang = (Math.PI/2) + (k/n)*Math.PI*2;    // เริ่มที่ 90° (ล่าง) วนตามเข็ม
    const x = 50 + 41*Math.cos(ang);              // % ของกว้าง (วงรี: กว้าง 41%, สูง 38%)
    const y = 50 + 38*Math.sin(ang);
    return {s, x, y};
  });
  // สรุปกลางโต๊ะ
  const potLabel = (r.streets&&r.streets.length)||(S.room.settings.multiStreet&&r.phase==='BETTING') ? 'กองกลางสะสม' : 'กองกลาง';
  const sub = r.phase==='ANTE'
    ? 'เฟสลงกองกลาง · รอ '+r.seats.filter(x=>x.state==='IN'&&x.ante<=0).map(x=>esc(nameOf(S,x.memberId))).slice(0,3).join(' กับ ')
    : r.turn ? 'ตาของ '+esc(nameOf(S,r.turn))+(r.currentBet>0?' · ต้องตามถึง ฿'+fmtS(r.currentBet):'')
    : r.complete ? 'ครบตาแล้ว' : '';
  const note = actionNotation(r);
  const noteShort = note ? note.split(' › ').slice(-5).join(' › ') : '';
  return `<div class="ptable">
    <div class="felt"></div>
    <div class="pcenter">
      <span class="plbl">${potLabel}</span>
      <span class="pamt num">฿${fmtS(r.pot)}</span>
      ${sub?`<span class="psub">${sub}</span>`:''}
      ${noteShort?`<span class="pnote num">${note.length>noteShort.length?'… ':''}${esc(noteShort)}</span>`:''}
    </div>
    ${spots.map(({s,x,y})=>{
      const v = seatVisual(r,s); if(!v) return '';
      return `<div class="pseat ${v.cls}" style="left:${x}%;top:${y}%">
        <span class="pos">${s.pos}</span>
        <span class="av" style="border-color:${v.ring}${v.isTurn?';box-shadow:0 0 0 3px rgba(245,178,61,.5)':''}">${v.face}</span>
        <span class="nm">${esc(v.m.name)}</span>
        <span class="bg" style="${v.bstyle}">${v.badge}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- ring row (แถวแนวนอนแบบเดิม — ใช้ในจอ Admin คุมห้อง) ---------- */

    const isMe = s.memberId===me.id;
    const isTurn = r.turn===s.memberId && r.status==='OPEN';
    let ring='var(--border)', badge='', bstyle='', cls='';
    if(s.state==='FOLDED'){ cls='fold'; badge='หมอบ'; }
    else if(s.state==='SITTING_OUT'){ cls='fold'; badge='พัก'; }
    else if(r.phase==='ANTE'){
      if(s.ante>0){ ring='var(--pot)'; badge='฿'+fmtS(s.ante); bstyle='background:var(--pot);color:#241705;border-color:var(--pot)'; }
      else { badge='รอลงกอง'; if(s.memberId===r.starterId) ring='var(--pending)'; }
    }
    else if(s.contributed>0){
      const t=r.tiers[s.tier]||{color:'var(--border)',ink:'#000'}; ring=t.color;
      badge='฿'+fmtS(s.contributed); bstyle=`background:${t.color};color:${t.ink};border-color:${t.color}`;
      if(needsAct(r,s)) badge += ' ↑';                    // ยังต้องตามเพิ่ม
    }
    else if(s.acted && !needsAct(r,s)){ badge='ผ่าน'; }
    else { badge = isTurn?(isMe?'ตาคุณ':'ตานี้'):'รอลง'; if(m.role==='ADMIN'||m.role==='CO_ADMIN') ring='var(--admin)'; }
    if(isMe && s.state==='IN') cls+=' me';
    if(isTurn) cls+=' turn';
    const face = (m.role==='ADMIN'||m.role==='CO_ADMIN') ? '👑' : (isMe?'คุณ':esc(initials(m.name)));
    return `<div class="pr ${cls}">
      <span class="pos">${s.pos}</span>
      <span class="av" style="border-color:${ring}${isTurn?';box-shadow:0 0 0 3px rgba(245,178,61,.5)':''}">${face}</span>
      <span class="nm">${esc(m.name)}</span>

function turnBanner(r){
  if(!r || r.status!=='OPEN') return '';
  if(r.phase==='ANTE'){
    const left = r.seats.filter(x=>x.state==='IN'&&x.ante<=0);
    return `<div class="ban i">🪙 ลงเงินกองกลาง คนละ ฿${fmtS(r.anteAmount)} — เหลืออีก ${left.length} คน
      <span class="sp"></span><span class="cap">ครบแล้วเริ่มที่ ${esc(nameOf(S,r.starterId))}</span></div>`;
  }
  if(r.complete) return `<div class="ban g">✅ ครบตาแล้ว — ทุกคนลงเท่ากันที่ ฿${fmtS(r.currentBet)}${S.room.settings.autoClose?'':' · รอ Admin ปิดรอบ'}</div>`;
  if(!r.turn) return '';
  const mine = r.turn===me.id;
  const s = seatOf(r,r.turn);
  const need = Math.max(0, r.currentBet-(s?s.contributed:0));
  return `<div class="ban ${mine?'y pulse':'n'}">
    ${mine?'👉 ตาคุณแล้ว':'⏳ ตาของ '+esc(nameOf(S,r.turn))}
    <span class="sp"></span>
    <span class="num">${need>0?'ต้องตามเพิ่ม ฿'+fmtS(need):'ผ่านได้ (ยังไม่มีใครลง)'}</span></div>`;
}
function tierLegend(r){
  if(!r || !r.tiers.length) return '';
  return `<div class="legend">
    ${r.tiers.map((t,i)=>`<span><i class="sw" style="background:${t.color}"></i>฿${fmtS(t.amount)}${i===0?' (คนแรก)':''}</span>`).join('')}
    <span><i class="sw" style="border:1.5px dashed #66717F"></i>หมอบการ์ด</span>
  </div>`;
}
function potCard(r){
  if(!r) return `<div class="card"><div class="empty"><span class="ic">🪙</span><b>ยังไม่มีรอบที่เปิด</b><span class="cap">รอ Admin กดเปิดรอบ</span></div></div>`;
  const c = {bet:0,folded:0,wait:0,checked:0};
  r.seats.forEach(s=>{ if(s.state==='FOLDED')c.folded++;
    else if(s.state==='SITTING_OUT'){}
    else if(needsAct(r,s))c.wait++;
    else if(s.contributed>0)c.bet++; else c.checked++; });
  const note = actionNotation(r);
  const anteSum = r.seats.reduce((a,s)=>a+(s.ante||0),0);
  const curSum  = r.seats.reduce((a,s)=>a+(s.contributed||0),0);
  const multi = (r.streets&&r.streets.length) || (S.room.settings.multiStreet && r.phase==='BETTING');
  /* ตอบ 3 คำถามในการ์ดเดียว: รวมเท่าไหร่ · ตอนนี้รอบไหน · แต่ละรอบที่ผ่านมาเท่าไหร่ */
  return `<div class="card" style="background:var(--pot-bg);border-color:var(--pot);padding:10px 12px">
    <div class="row" style="gap:10px">
      <div class="col" style="gap:2px">
        <span class="lbl pot" style="font-size:10.5px">🪙 เงินรวมในกอง</span>
        <span class="money pot num" style="font-size:32px">฿${fmtS(r.pot)}</span>
      </div>
      <div class="sp"></div>
      <div class="col" style="gap:2px;text-align:right">
        ${multi?`<span class="h2" style="color:var(--pot)">รอบลงเงินที่ ${r.street}</span>`:''}
        <span class="cap">ตามครบ ${c.bet} · รอ ${c.wait}${c.folded?' · หมอบ '+c.folded:''}</span>
        <span class="cap">${r.currentBet>0?'ต้องตามถึง ฿'+fmtS(r.currentBet):'รอบนี้ยังไม่มีใครลง'}</span>
      </div>
    </div>
    ${multi?`<div class="streets">
      ${anteSum?`<span class="st done"><i>ลงกอง</i><b class="num">฿${fmtS(anteSum)}</b></span>`:''}
      ${(r.streets||[]).map(x=>`<span class="st done"><i>รอบ ${x.index}</i><b class="num">฿${fmtS(x.total)}</b></span>`).join('')}
      <span class="st now"><i>รอบ ${r.street} ▶</i><b class="num">฿${fmtS(curSum)}</b></span>
    </div>`:''}
  </div>`;
}

/* ---------- player home ---------- */
function vPlayerHome(){ return betPanel(false); }

function betPanel(adminMode){
  const r = S.curRound, w = myWallet(), s = r?seatOf(r,me.id):null;
  const chips = S.room.settings.chips;
  const sel = UI.form.betSel ?? null;
  const cur = r?r.currentBet:0;
  const myPend = pendingForMe();
  let head = '';
  if(r && r.status==='LOCKED') head = `<div class="ban n">🔒 ปิดรับลงเงินแล้ว — รอ Admin จ่ายเงิน</div>`;
  else if(r && r.status==='SETTLED') head = `<div class="ban n">🏁 รอบที่ ${r.index} จบแล้ว — รอ Admin เปิดรอบใหม่</div>`;

  /* ───── ช่วงลงเงินกองกลาง (ante) ───── */
  if(r && r.status==='OPEN' && r.phase==='ANTE'){
    const need = r.anteAmount, paid = s?s.ante>0:false;
    const inSeats = r.seats.filter(x=>x.state==='IN');
    const done = inSeats.filter(x=>x.ante>0);
    const left = inSeats.filter(x=>x.ante<=0);
    const pct = inSeats.length ? Math.round(done.length/inSeats.length*100) : 0;
    return `
    ${myPend.length?`<button class="notice" data-act="openPend">🔔 ${myPend.length} คำขอรอคุณตอบ ›</button>`:''}
    <div class="ban i" style="gap:6px">🪙 <b>ลงเงินกองกลาง คนละ ฿${fmtS(need)}</b>
      <span class="sp"></span><span class="num ${pct===100?'in':''}">${done.length}/${inSeats.length}</span></div>
    ${pokerTable(r)}
    ${r.starterId?`<div class="cap" style="text-align:center">ครบแล้วเริ่มเดิมพันที่ <b>${esc(nameOf(S,r.starterId))}</b>${S.lastWinnerId===r.starterId?' 🏆 (ชนะรอบก่อน)':''}</div>`:''}

    ${paid
      ? `<div class="turnbox done"><span class="who">✅ คุณลงแล้ว ฿${fmtS(s.ante)}</span>
           <span class="sub">รออีก ${left.length} คน แล้วเริ่มเดิมพันได้เลย</span></div>`
      : s && s.state==='SITTING_OUT'
      ? `<div class="ban n">💤 คุณพักรอบนี้</div>`
      : `<div class="turnbox mine"><span class="who">🪙 ถึงคิวคุณลงกองกลาง</span>
           <span class="sub">ทุกคนต้องลงเท่ากันก่อนถึงจะเริ่มเดิมพันได้</span></div>`}
    `;
  }

  const myTurn = r && r.status==='OPEN' && (!S.room.settings.strict || r.turn===me.id);
  const canAct = r && r.status==='OPEN' && s && s.state==='IN' && needsAct(r,s) && myTurn;
  const mineIn = s?s.contributed:0;

  // แถบขึ้นเดิมพัน
  let raise='';
  if(canAct && sel!==null && sel>cur){
    const ti = r.tiers.findIndex(x=>x.amount===sel);
    const col = ti>=0?r.tiers[ti].color:TIER_COLORS[r.tiers.length%TIER_COLORS.length];
    raise = `<div class="ban i" style="border-color:${col};color:${col};background:var(--info-bg);flex-direction:column;align-items:flex-start;gap:3px">
      <b>คุณกำลังขึ้นเดิมพันเป็น ฿${fmtS(sel)} — ได้สีใหม่</b>
      <span class="cap">ทุกคนที่ยังไม่หมอบต้องกลับมาตามให้ถึง ฿${fmtS(sel)} หรือหมอบ</span></div>`;
  }

  const chipHtml = chips.map(cB=>{
    const v = B(cB);
    const locked = !canAct || v<cur || v<=mineIn;
    return pokerChip(cB, (locked?'lock ':'')+(sel===v?'on':''),
      `data-act="${locked?'lockedChip':'pickChip'}" data-v="${v}"`);
  }).join('');
  const canCheck = canAct && mineIn===cur;

  /* กล่องบอกสถานะ — ตัวใหญ่ที่สุดบนจอ อ่านปราดเดียวรู้ว่าต้องทำอะไร */
  let box='';
  if(r && r.status==='OPEN'){
    /* "ตาที่ i/n" — นับจากตำแหน่งคิวของคนที่ถือตาอยู่ ในบรรดาคนที่ยังเล่นรอบนี้ */
    const inOrder = r.seats.filter(x=>x.state==='IN').sort((a,b)=>a.pos-b.pos);
    const ti = r.turn ? inOrder.findIndex(x=>x.memberId===r.turn) : -1;
    const turnLbl = ti>=0 ? 'ตาที่ '+(ti+1)+'/'+inOrder.length : '';
    if(s && s.state==='FOLDED')
      box = `<div class="turnbox"><span class="who">🃏 คุณหมอบรอบนี้แล้ว</span><span class="sub">รอดูผลรอบนี้ · ลงใหม่ได้รอบหน้า</span></div>`;
    else if(s && s.state==='SITTING_OUT')
      box = `<div class="turnbox"><span class="who">💤 คุณพักรอบนี้</span><span class="sub">ลงได้ในรอบถัดไป</span></div>`;
    else if(s && !needsAct(r,s))
      box = `<div class="turnbox done"><span class="who">✅ คุณลงครบแล้ว ฿${fmtS(s.contributed)}</span>
             <span class="sub">${r.turn?'รอ '+esc(nameOf(S,r.turn))+(turnLbl?' ('+turnLbl+')':''):'รอคนอื่นลงให้ครบ'}</span></div>`;
    else if(canAct)
      box = `<div class="turnbox mine"><span class="who">👉 ตาคุณแล้ว! ${turnLbl?'('+turnLbl+')':''}</span>
             <span class="sub">${cur>mineIn?'ต้องตามให้ถึง ฿'+fmtS(cur)+' (จ่ายเพิ่ม ฿'+fmtS(cur-mineIn)+') · ขึ้นก็ได้ · หรือหมอบ'
                                        :'ยังไม่มีใครลง — ผ่านฟรี หรือเปิดเดิมพันก่อนก็ได้'}</span></div>`;
    else
      box = `<div class="turnbox"><span class="who">⏳ ตาของ ${esc(nameOf(S,r.turn)||'—')} ${turnLbl?'('+turnLbl+')':''}</span>
             <span class="sub">รอสักครู่ เดี๋ยวถึงตาคุณระบบจะส่งเสียงเตือน</span></div>`;
  }

  return `
  ${myPend.length?`<button class="notice" data-act="openPend">🔔 ${myPend.length} คำขอรอคุณตอบ ›</button>`:''}
  ${head}
  ${box}
  ${raise}
  ${s && paidTotal(s)>0 ? `<div class="mypaid num">มือนี้ฉันลงไปแล้ว <b>฿${fmtS(paidTotal(s))}</b>
      <span class="d">${[s.ante?'ลงกอง ฿'+fmtS(s.ante):'', s.paid?'รอบก่อน ฿'+fmtS(s.paid):'', s.contributed?'รอบนี้ ฿'+fmtS(s.contributed):''].filter(Boolean).join(' · ')}</span></div>`:''}
  ${pokerTable(r)}
  ${canAct?`
  <div class="col" style="gap:6px">
    <div class="chips">${chipHtml}</div>
    <div class="g2">
      <button class="btn sec sm" style="width:100%;height:34px" data-act="${canCheck?'check':'lockedCheck'}" ${canCheck?'':'disabled'}>
        ${canCheck?'⏭ ผ่าน (ไม่เสียเงิน)':'⏭ ผ่านไม่ได้ 🔒'}</button>
      <button class="btn sec sm" style="width:100%;height:34px" data-act="modal" data-m="custom">⌨ ใส่ยอดเอง</button>
    </div>
    ${sel!==null?`<div class="cap num" style="text-align:center">เลือก ฿${fmtS(sel)} → จ่ายเพิ่ม ฿${fmtS(Math.max(0,sel-mineIn))} · เหลือ ฿${fmtBalS(Math.max(0,w.balance-(sel-mineIn)))}</div>`
               :`<div class="cap" style="text-align:center">ตัวเลขบนชิพคือ <b>ยอดรวมของรอบนี้</b> ไม่ใช่ยอดที่จ่ายเพิ่ม</div>`}
  </div>`:''}
  `;
}

function vFooterAction(){
  if(UI.screen!=='home') return '';
  if(isAdmin() && UI.tab==='control') return '';
  const r = S.curRound, w = myWallet();
  const s = r?seatOf(r,me.id):null;
  if(!isPlayer() || !r || r.status!=='OPEN' || !s) return '';

  /* ปุ่มลงกองกลาง */
  if(r.phase==='ANTE'){
    if(s.state!=='IN' || s.ante>0) return '';
    const need = r.anteAmount, poor = w.balance < need;
    return `<div class="foot">
      <button class="btn big sec" style="width:104px;flex:none" data-act="anteSitout">พักรอบนี้<small>ไม่ลงเงิน</small></button>
      <button class="btn big gold" data-act="ante" ${poor?'disabled':''}>
        ${poor?'เงินไม่พอ (ต้องมี ฿'+fmtS(need)+')':'🪙 ลงกองกลาง ฿'+fmtS(need)}
        ${poor?'':`<small>คงเหลือ ฿${fmtBalS(w.balance-need)}</small>`}</button>
    </div>`;
  }

  if(s.state!=='IN' || !needsAct(r,s)) return '';
  if(S.room.settings.strict && r.turn && r.turn!==me.id)
    return `<div class="foot"><button class="btn big" disabled>รอตาคุณ… (ตาของ ${esc(nameOf(S,r.turn))})</button></div>`;
  const sel = UI.form.betSel ?? null, cur = r.currentBet, mine = s.contributed;
  const cost = sel!==null ? sel-mine : 0;
  let main, dis=false, sub='';
  if(sel===null){ main='เลือกยอดก่อน'; dis=true; }
  else if(cost<=0){ main='ยอดต้องมากกว่าที่ลงไว้'; dis=true; }
  else if(cost>w.balance){ main='เงินไม่พอ (ขาด ฿'+fmtS(cost-w.balance)+')'; dis=true; }
  else {
    if(cur===0) main='ลงเดิมพัน ฿'+fmtS(sel)+' (คนแรก)';
    else if(sel===cur) main='ตาม ฿'+fmtS(sel);
    else main='ขึ้นเป็น ฿'+fmtS(sel);
    sub = (mine>0?'จ่ายเพิ่ม ฿'+fmtS(cost)+' · ':'')+'คงเหลือ ฿'+fmtBalS(w.balance-cost);
  }
  return `<div class="foot">
    <button class="btn big sec" style="width:112px;flex:none" data-act="fold">หมอบการ์ด<small>ไม่เสียเงิน</small></button>
    <button class="btn big" data-act="bet" ${dis?'disabled':''}>${main}${sub?`<small>${sub}</small>`:''}</button>
  </div>`;
}

/** ปุ่มจัดการรอบ — ใช้ร่วมกันทั้งแท็บคุมห้องและเมนูปุ่มลอย */
function roundControls(r, big){
  const g = big?' big':'';
  if(!r || r.status==='SETTLED' || r.status==='VOIDED')
    return `<button class="btn big" data-act="openRound">▶ เปิดรอบใหม่</button>`;
  if(r.status==='OPEN')
    return `<button class="btn gold${g}" data-act="nav" data-s="payout">🏁 จบรอบ &amp; จ่ายเงินกองกลาง</button>
      <div class="g2">
        <button class="btn ${r.complete?'':'sec'}" data-act="lockRound">🔒 ปิดรับลงเงิน</button>
        <button class="btn sec" data-act="voidRound">✖ ยกเลิกรอบ</button>
      </div>`;
  return `<button class="btn gold${g}" data-act="nav" data-s="payout">🏁 จบรอบ &amp; จ่ายเงินกองกลาง</button>
    <div class="g2">
      <button class="btn sec" data-act="unlockRound">🔓 เปิดรับอีกครั้ง</button>
      <button class="btn sec" data-act="voidRound">✖ ยกเลิกรอบ</button>
    </div>`;
}

function vAdminControl(){

        : 'ตอนนี้: ทุกคนลงเท่ากัน → '+(S.room.settings.autoClose?'ปิดรับลงเงินทันที':'รอคุณกดปิดเอง')}</div>

        <button class="btn sm" style="margin-left:auto" data-act="payAlone" data-m="${only.memberId}">จ่ายเลย</button></div>`; })() : '';

  return `

      <span class="money-l num ${inSys===ni?'in':'out'}">฿${fmtS(inSys)} ${inSys===ni?'✅':'⛔'}</span></div>
  </div>
  ${potCard(r)}
  <div class="col" style="gap:8px">${ctrl}</div>
  ${alone}

  ${turnBanner(r)}

    <div class="col" style="gap:6px">

        return `<div class="row" style="gap:8px">
          <span style="width:60px;font:600 11.5px/1.2 var(--f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.role==='ADMIN'?'👑 ':''}${esc(p.name)}</span>

function txRow(t){
  const inb = t.to==='W:'+me.id;
  const lbl = {ISSUE_INITIAL:'เงินเริ่มต้นจาก BANK',TOPUP_GRANT:'Admin เติมเงินให้',TOPUP_REQUEST:'เติมเงิน (อนุมัติแล้ว)',
    RETURN_TO_BANK:'คืนเงินเข้า BANK',TRANSFER_GIVE:'โอนเงิน',TRANSFER_BORROW:'ยืมเงิน',DEBT_REPAY:'คืนหนี้',
    BET:'ลงกอง',UNBET:'คืนจากกอง',PAYOUT:'รับเงินกองกลาง',REVERSAL:'กลับรายการ'}[t.type]||t.type;
  const who = t.from.startsWith('W:')&&t.to.startsWith('W:')
    ? esc(nameOf(S,t.from.slice(2)))+' → '+esc(nameOf(S,t.to.slice(2)))
    : (t.from==='BANK'?'BANK → '+esc(nameOf(S,t.to.slice(2))):t.to==='BANK'?esc(nameOf(S,t.from.slice(2)))+' → BANK'
      : t.type==='BET'?esc(nameOf(S,t.from.slice(2)))+' → กองกลาง':'กองกลาง → '+esc(nameOf(S,t.to.slice(2))));
  const isMine = t.from==='W:'+me.id||t.to==='W:'+me.id;
  return `<div class="lrow"><div class="col" style="gap:2px">
      <b style="font:600 12.5px/1.2 var(--f)">#${t.seq} ${lbl}</b>
      <span class="cap">${who}${t.note?' · '+esc(t.note):''}</span></div>
    <span class="sp"></span>
    <span class="money-s num ${isMine?(inb?'in':'out'):'mut'}">${isMine?(inb?'+':'−'):''}฿${fmtS(t.amount)}</span></div>`;
}

/** รายการย่อย "ยืมใครบ้าง / ให้ใครยืมบ้าง" */
function debtLines(s){
  const line = (x,dir) => `<div class="row" style="gap:8px;padding:3px 0">
      <span class="av2" style="width:26px;height:26px;font-size:10px">${esc(initials(nameOf(S,x.id)))}</span>
      <span class="cap" style="color:var(--tp)">${esc(nameOf(S,x.id))}</span>
      <span class="sp"></span>
      <span class="money-s num ${dir==='owe'?'out':'in'}">฿${fmtS(x.amount)}</span></div>`;
  return `
    ${s.owes.length?`<div class="col" style="gap:2px">
      <span class="lbl out">🔴 ยืมมา — ยังต้องคืน ฿${fmtS(s.owesTotal)}</span>
      ${s.owes.map(x=>line(x,'owe')).join('')}</div>`:''}
    ${s.lent.length?`<div class="col" style="gap:2px">
      <span class="lbl in">🟢 ให้ยืมไป — รอรับคืน ฿${fmtS(s.lentTotal)}</span>
      ${s.lent.map(x=>line(x,'lend')).join('')}</div>`:''}`;
}

function settleSuggest(){
  const arr = Object.values(S.members).filter(m=>m.status==='PLAYING').map(p=>{
    const w=S.wallets[p.id]||{balance:0,issuedIn:0,returnedOut:0};
    return {name:p.name, v:w.balance-(w.issuedIn-w.returnedOut)}; }).filter(x=>x.v!==0);
  if(!arr.length) return '';
  const debt = arr.filter(a=>a.v<0).map(a=>({...a,v:-a.v})).sort((a,b)=>b.v-a.v);
  const cred = arr.filter(a=>a.v>0).sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const x=Math.min(debt[i].v,cred[j].v);
    if(x>0) out.push(`${debt[i].name} จ่าย ${cred[j].name} ฿${fmtS(x)}`);
    debt[i].v-=x; cred[j].v-=x;
    if(debt[i].v<=0)i++; if(cred[j].v<=0)j++;
  }
  return out.length?`<div class="card col"><b class="h2">ใครจ่ายใคร (คำแนะนำเคลียร์เงินสด)</b>
    ${out.map(o=>`<span class="cap">• ${esc(o)}</span>`).join('')}</div>`:'';
}

/** ไพ่ 1 ใบ — open = หงายค้าง · flip = พลิกไปพลิกมาไม่หยุด */
function playCard(mode, i){
  const suits=[['♠','#10151C'],['♥','#C8272D'],['♦','#C8272D'],['♣','#10151C']];
  const [pip,col] = suits[i%4];
  return `<div class="pcard ${mode}">
    <div class="in">
      <div class="bk"></div>
      <div class="fc"><span class="pip" style="color:${col}">${pip}</span><span class="no">?</span></div>
    </div></div>`;
}
/** ป๊อปอัพเปิดไพ่กลาง — street 2: เปิด 3 ใบ · 3: ใบที่ 4 · 4: ใบที่ 5 */
function mReveal(street){
  const opened = street===2 ? 0 : street===3 ? 3 : 4;   // ใบที่หงายค้างแล้ว
  const flipping = street===2 ? 3 : 1;                   // ใบที่กำลังพลิก
  const title = street===2 ? 'เปิดไพ่ 3 ใบ!' : street===3 ? 'เปิดไพ่ใบที่ 4!' : 'เปิดไพ่ใบที่ 5!';
  let cards='';
  for(let i=0;i<opened;i++) cards += playCard('open', i);
  for(let i=0;i<flipping;i++) cards += playCard('flip', opened+i);
  return mWrap(`
    <b class="h1" style="text-align:center">🃏 ${title}</b>

        <span class="av2" style="border-color:var(--pot)">${esc(initials(nameOf(S,w.memberId)))}</span>
        <span class="n">${esc(nameOf(S,w.memberId))}${w.memberId===me.id?' (คุณ)':''}</span>

function mConfirm(m){

function mSummary(r){
  const mySeat = seatOf(r,me.id);
  const myWin = (r.winners.find(w=>w.memberId===me.id)||{}).amount||0;
  const myBet = mySeat?paidTotal(mySeat):0;
  const net = myWin-myBet;
  const iWon = myWin>0;
  return mWrap(`<b class="h1" style="text-align:center">🏁 จบรอบที่ ${r.index}</b>
    <div class="card col" style="align-items:center;gap:9px;background:var(--pot-bg);border-color:var(--pot)">
      <span style="font-size:40px;line-height:1">🏆</span>
      ${r.winners.length
        ? r.winners.map(w=>`<div class="col" style="align-items:center;gap:2px">
             <b class="h1" style="color:var(--pot)">${esc(nameOf(S,w.memberId))}${w.memberId===me.id?' (คุณ)':''}</b>
             <span class="money num pot">+฿${fmtS(w.amount)}</span></div>`).join('')
        : '<b class="h2">ไม่มีผู้ชนะ (กองว่าง)</b>'}
      ${chipStack(r.totalIn,'sm')}
    </div>
    ${r.startNextId?`<div class="ban g">▶ รอบถัดไปเริ่มลงเงินที่ <b>${esc(nameOf(S,r.startNextId))}${r.startNextId===me.id?' (คุณ)':''}</b></div>`:''}
    ${mySeat?`<div class="card col" style="align-items:center;gap:3px;${iWon?'border-color:var(--brand)':''}">
      <span class="lbl">ผลของคุณรอบนี้</span>
      <span class="money num ${net>0?'in':net<0?'out':''}">${net>0?'+':net<0?'−':''}฿${fmtS(Math.abs(net))}</span>
      <span class="cap">ลงไป ฿${fmtS(myBet)} · ได้รับ ฿${fmtS(myWin)} · กระเป๋าตอนนี้ ฿${fmtS(myWallet().balance)}</span>
    </div>`:''}
    ${(r.streets&&r.streets.length)?`<div class="card col" style="gap:6px">
      <b class="lbl">เงินที่ลงแต่ละรอบ</b>
      <div class="breakdown">
        ${r.seats.reduce((a,s)=>a+(s.ante||0),0)?`<span><i>ลงกอง</i><b class="num">฿${fmtS(r.seats.reduce((a,s)=>a+(s.ante||0),0))}</b></span>`:''}
        ${r.streets.map(x=>`<span><i>รอบ ${x.index}</i><b class="num">฿${fmtS(x.total)}</b></span>`).join('')}
        ${r.seats.reduce((a,s)=>a+(s.contributed||0),0)?`<span><i>รอบ ${r.street}</i><b class="num">฿${fmtS(r.seats.reduce((a,s)=>a+(s.contributed||0),0))}</b></span>`:''}
        <span class="tot"><i>รวม</i><b class="num">฿${fmtS(r.totalIn)}</b></span>
      </div>
      ${r.streets.filter(x=>x.note).map(x=>`<div class="cap"><b>รอบ ${x.index}:</b> <span class="num">${esc(x.note)}</span></div>`).join('')}
    </div>`:''}
    <table><thead><tr><th>ผู้เล่น</th><th>ลงทั้งหมด</th><th>ได้รับ</th></tr></thead><tbody>
      ${r.seats.map(s=>{ const wn=(r.winners.find(w=>w.memberId===s.memberId)||{}).amount||0;
        return `<tr><td>${esc(nameOf(S,s.memberId))}${s.state==='FOLDED'?' <span class="cap">(หมอบ)</span>':''}</td>
          <td class="num">${paidTotal(s)?fmtS(paidTotal(s)):'—'}</td><td class="num ${wn?'in':''}">${wn?fmtS(wn):'—'}</td></tr>`; }).join('')}
      <tr style="font-weight:700"><td>รวม</td><td class="num">${fmtS(r.totalIn)}</td><td class="num">${fmtS(r.winners.reduce((a,w)=>a+w.amount,0))} ✅</td></tr>
    </tbody></table>
    <button class="btn" data-act="closeModal">ปิด</button>
    ${isAdmin()?`<button class="btn gold" data-act="openRoundFromSummary">▶ เปิดรอบใหม่</button>`:''}
    ${sumAuto?`<div class="cap" style="text-align:center">ปิดเองใน ${sumSecs} วินาที (ตั้งได้ในตั้งค่า)</div>`:''}`, true);
}

      : await cmd({t:'ISSUE',mid:d.mid,amount:a,kind:'TOPUP_GRANT',note:'Admin เติมให้'});
    if(ok) A.closeModal(); },
  removeMember(d){ UI.modal={k:'confirm',title:'เอาผู้เล่นออกจากวง?',text:'ต้องเคลียร์เงินในกระเป๋าให้เป็น 0 ก่อน',ok:'เอาออก',danger:true,
    fn:()=>cmd({t:'MEMBER_REMOVED',mid:d.mid})}; render(); },

  seatDelta(d){ cmd({t:'SEATS_SET',n:S.room.maxSeats+Number(d.d)}); },
  setToggle(d,el){ const s={}; s[d.k]=el.checked; cmd({t:'SETTINGS_SET',settings:s}); },
  saveStart(){ const v=B(parseAmt($('#s_start').value)||0); cmd({t:'SETTINGS_SET',settings:{startAmount:v}}); toast('บันทึกแล้ว','g'); },
  saveAnte(){ const v=B(parseAmt($('#s_ante').value)||0); cmd({t:'SETTINGS_SET',settings:{anteAmount:v}}); toast('บันทึกแล้ว มีผลรอบถัดไป','g'); },
  copyCode(){ navigator.clipboard?.writeText(S.room.code); toast('คัดลอกรหัสห้องแล้ว','g'); },
  hfilter(d){ UI.form.hfilter=d.f; render(); },
  debtToggle(d){ UI.form.debtOpen = (UI.form.debtOpen===d.mid) ? null : d.mid; render(); },
  async returnAll(){
    for(const [mid,w] of Object.entries(S.wallets)){
      if(w.balance>0) await Store.append({t:'RETURN_TO_BANK',mid,amount:w.balance,note:'เคลียร์ยอดปิดห้อง',by:me.id});
    }
    refresh(); toast('คืนเงินทุกคนเข้า BANK แล้ว','g'); },
  closeRoom(){ UI.modal={k:'confirm',title:'ปิดห้องถาวร?',text:'หลังปิดจะอ่านได้อย่างเดียว แก้ไขอะไรไม่ได้อีก',ok:'ปิดห้อง',danger:true,
    fn:()=>cmd({t:'ROOM_CLOSED'})}; render(); },
  exportCsv(){
    const rows=[['seq','เวลา','ประเภท','จาก','ไป','จำนวน(บาท)','หมายเหตุ']];
    const nm=a=>a==='BANK'?'BANK':a.startsWith('W:')?nameOf(S,a.slice(2)):'กองกลาง';
    S.txs.forEach(t=>rows.push([t.seq,new Date(t.at).toLocaleString('th-TH'),t.type,nm(t.from),nm(t.to),(t.amount/100).toFixed(2),t.note]));
    const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='ledger-'+S.room.code+'.csv'; a.click(); toast('ดาวน์โหลดแล้ว','g'); },

};
function getFbCfg(){ return sbCfg(); }

/* ---------- event delegation ---------- */
document.addEventListener('click', e=>{
  Sfx.unlock();
  const el = e.target.closest('[data-act]');
  if(!el){ return; }
  if(el.dataset.act==='closeMask' && e.target.closest('[data-stop]')) return;
  const fn = A[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act]');
  if(el && el.type==='checkbox' && A[el.dataset.act]) A[el.dataset.act](el.dataset, el, e);
});
document.addEventListener('input', e=>{
  if(e.target.classList.contains('wamt')){
    const w = UI.form.winners||{};
    w[e.target.dataset.mid] = B(parseAmt(e.target.value)||0);
    UI.form.winners=w;
    // อัปเดตเฉพาะแถบยอด ไม่ re-render ทั้งหน้า (กัน input เสีย focus)
    const r=S.curRound, paid=Object.values(w).reduce((a,b)=>a+b,0), left=r.pot-paid;
    const ban=document.querySelector('.body .ban:last-of-type'), btn=document.querySelector('.foot .btn');
    if(ban){ ban.className='ban '+(left===0?'g':left>0?'y':'r');
      ban.innerHTML=`<b class="num">กอง ฿${fmtS(r.pot)} · จ่าย ฿${fmtS(paid)} · ${left>=0?'เหลือ':'เกิน'} ฿${fmtS(Math.abs(left))}</b>
        <span class="sp"></span>${left===0?'✅ ยอดตรงพอดี':left>0?'⚠️ ยังจ่ายไม่ครบ':'⛔ จ่ายเกินกอง'}`; }
    if(btn){ if(left===0) btn.removeAttribute('disabled'); else btn.setAttribute('disabled',''); }
  }
});

/* ---------- boot ---------- */
Sfx.init();
hideBal = LS.get('pk:hidebal')==='1';
sumAuto = LS.get('pk:sumauto')!=='0';
sumSecs = Math.max(2, Math.min(60, parseInt(LS.get('pk:sumsecs'))||5));
UI.theme = LS.get('pk:theme')||'dark';
document.documentElement.setAttribute('data-theme', UI.theme==='light'?'light':'dark');
if(sbCfg()) Store.mode='cloud';

(async function boot(){
  const last = LastRoom.load();
  if(!last){ render(); return; }
  // เคยอยู่ห้องไหน กลับเข้าห้องนั้นเลย
  UI.screen='boot'; render();
  try{
    await Store.open(last.code, last.mode || Store.mode);
    S = reduce(Store.events);
    if(S.room){ UI.screen='home'; UI.tab='control'; refresh(); return; }
    toast('ไม่พบห้อง '+last.code+' แล้ว','y');
  }catch(e){
    toast('กลับเข้าห้องเดิมไม่สำเร็จ: '+e.message,'r');
  }
  LastRoom.clear(); Store.close(); S=blankState(); UI.screen='landing'; render();
})();
</script>
